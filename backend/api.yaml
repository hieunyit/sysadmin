openapi: 3.1.0
info:
  title: OpenVPN Access Server Web API
  description: |
    This API provides everything required to implement functionality for downloading
    profiles, managing clients, and the Admin Web UI.

    This document follows these conventions:

      - Field names - snake case
      - URLs: kebab-case (dashes)
      - Other identifiers: camel case

    The API supports proxying requests to different nodes in an Access Server cluster.
    This is only necessary and supported for the admin endpoints.

    Please that this API is still in development and stability is not guaranteed.
    API endpoints and parameters can change without notice.

    Great care has been taken that this documentation matches the implementation.
    However, some discrepancies may still exist.

    To view this API documentation in Swagger, go to:
    https://access-server.examples.com/api/docs. Ensure you have enabled
    this feature by setting the
    `openapi.web_access` configuration variable to 1:

        sacli --key "openapi.web_access" --value 1 ConfigPut

    Alternatively, you can set the variable using the Admin Web UI's configuration editor.

    For additional details about the Access Server API, visit:
    https://openvpn.net/static-links/documentation-access-server-web-api
  version: "0.2"
tags:
  - name: auth
    description: Endpoints for handling authentication to the API. All successful login calls
      return an opaque authentication token (auth token).
  - name: client-import-api
    description: Endpoints used by compatible OpenVPN clients to import connection profiles from Access Server.
  - name: profiletoken
    description: Endpoints for managing profile tokens used to generate one-time import URLs.
      These tokens are also part of the the web-based profile import flow for OpenVPN clients.
  - name: profile
    description: Endpoints for managing connection profiles used by OpenVPN clients.
  - name: vpnca
    description: Endpoints for managing the certificate authorities (CAs) used to sign VPN server and client certificates.
  - name: info
    description: Endpoints for querying various aspects of the running server and its current status.
  - name: support
    description: Endpoints for gathering system information that can be provided to customer support for troubleshooting and assistance.
  - name: license
    description: Endpoints for examining and setting licensing of the AS instance
  - name: proxy
    description: A pseudo-endpoint that explains the proxying mechanism used to route API requests to other OpenVPN Access Server
      backend nodes in a clustered setup.
  - name: cluster
    description: Endpoints for configuring, monitoring, and managing an Access Server cluster, including node setup and status checks.
  - name: maintenance
    description: Endpoints for performing server maintenance tasks, such as restarting Access Server or its services.
  - name: configurationProfile
    description: 'API to manage Access Server main configuration database. These endpoints allow you to retrieve, update, and manage configuration values stored in the active or named configuration profiles.'
  - name: saml
    description: Endpoints for managing SAML-based authentication flow.
  - name: vpn
    description: Endpoints directly related to connected VPN users, including status queries and client session control.
  - name: cws
    description: CWS stands for Client Web Service. These endpoints are used by normal (non-admin) users to interact with Access Server, such as managing sessions or profiles. Some endpoints support optional admin-level functionality, like acting on behalf of another user.
  - name: userprop
    description: Endpoints for retrieving and modifying user properties stored in Access Server.
  - name: helper
    description: These endpoints provide utility functions that simplify specific tasks. While their functionality could be replicated with frontend logic or multiple backend calls, they exist to streamline workflows or avoid redundant implementations, such as parsing SAML metadata on the client side.
  - name: certificate
    description: Endpoints for certificate management tasks, such as parsing certificates or retrieving certificate metadata.
  - name: logs
    description: Endpoints for querying the Access Server log database.
  - name: user
    description: Endpoints for managing individual user configurations.
  - name: group
    description: Endpoints for managing group configurations.
  - name: misc
    description: APIs that do not fit in any other category
  - name: acme
    description: API calls that are related to the ACME client service that requests certificates from ACME enabled providers.

servers:
  - url: '/api'
  - url: 'https://access-server.example.com/api/'

paths:
  /saml/acs:
    servers:
      - description: SAML related URLs are found on the root of the web server instead of /api
        url: '/'
    post:
      tags:
        - saml
        - cws
      description: |
        Completes the SAML authentication process by accepting a SAML assertion from the Identity Provider (IdP).

        After a successful login at the IdP, the IdP redirects to the /saml/acs URL of the Access Server with the
        assertion. This endpoint processes the assertion to complete the login flow.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - SAMLResponse
              properties:
                RelayState:
                  description: cws, profile or vpnauth~nodeid~sessionid
                  type: string
                SAMLResponse:
                  type: string
                  format: xml string encoded in base64 format
      responses:
        200:
          description: Returns an HTML page (similar to index.html)
            that includes a JavaScript block assigning the SAML assertion to a `SAMLResponse` variable and
            the RelayState to a `RelayState` variable.
          content:
            text/html:
              examples:
                dummyhtml:
                  value: <
                    <head>
                    <javascript>
                    SAMLResponse = "[samlassertion data]";
                    RelayState = "cwslogin";
                    </javascript>

                    [content of index.html]
        400:
          description: Returned when the request is invalid or the assertion cannot be validated.
          content:
            text/html:
              examples:
                dummyhtml:
                  value: <
                    <head>HEAD content</head>
                    <body><h1>SAML authentication failed</h1><p>assertion request is invalid</p></body>
        405:
          description: Only POST requests are allowed at this endpoint.
          content:
            text/html:
              examples:
                dummyhtml:
                  value: <
                    <head>HEAD content</head>
                    <body><h1>SAML authentication failed</h1><p>assertion method is not supported</p></body>

  /saml/metadata:
    servers:
      - description: SAML related URLs are found on the root of the web server instead of /api
        url: '/'
    get:
      tags:
        - saml
      description: |
        Returns the SAML Service Provider metadata in XML format.

        This URL can be used by the IdP during the SAML authentication setup process.
      responses:
        200:
          description: Returns the XML metadata for the Access Server SAML Service Provider.
          content:
            application/samlmetadata+xml:
                schema:
                  type: string
                  format: xml

        404:
          description: SAML is not configured, or the configuration is invalid.
          content:
            text/html:
              examples:
                dummyhtml:
                  value: <
                    <head>HEAD content</head>
                    <body><h1>404 Not Found</h1><p>SAML not configured or invalid configuration</p></body>


  /saml/redirect:
    servers:
      - description: SAML related URLs are found on the root of the web server instead of /api
        url: '/'
    get:
      tags:
          - saml
      description: Used during the VPN session authentication to redirect to the SAML IdP when the URL is too long to transmit directly via the VPN protocol.
      security: []
      responses:
          302:
            description: Redirects the client to the SAML IdP URL.


  /openvpn-api/profile:
    servers:
      - description: API endpoints that are part of the OpenVPN web auth spec
        url: '/'
    head:
      tags:
        - profile
        - saml
        - client-import-api
      description: Used by OpenVPN clients to detect whether the server supports web-based
        login for profile import. This is part of the OpenVPN WebAuth flow. See the OpenVPN
        webauth API specification
        https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#detection-of-web-based-profile-download-support
        for full details.
      security: []
      responses:
        '302':
          description: 'Redirects to base server URL with headers in the response according to OpenVPN webauth API specification.'
          headers:
            Ovpn-WebAuth:
              description: Token indicating if WebAuth is supported. Client uses this to trigger browser-based import.
              schema:
                type: string

    get:
      tags:
        - profile
        - saml
        - cws
      security: []
      description: This endpoint is used by OpenVPN clients, not the Client Web UI,
        to initiate the profile import process. It differs from /api endpoints and
        redirects the client to the UI login page as defined in the OpenVPN API spec
        https://github.com/OpenVPN/openvpn3/blob/master/doc/webautha.md#detection-of-web-based-profile-download-support.
      responses:
        302:
          description: Redirect to http://server_addres/login?relay_state=profile


  /GetInstallerViaToken:
    servers:
      - description: API endpoints with the namespace '/rest/' instead of '/api'
        url: '/rest/'
    get:
      tags:
          - client-import-api
      description:
        Downloads a client installer from Access Server using a one-time authentication token.

        This endpoint is part of the REST API for client configuration and requires a token value
        that can be obtained from the installer-url endpoint. The client should also specify the
        installer_type, and optionally indicate support for TLS-Crypt v2.
      security:
        - ProfileDownloadToken: [ ]
      parameters:
        - $ref: '#/components/parameters/downloadTokenParameter'
        - $ref: '#/components/parameters/tlsCryptV2CapabilityParameter'
        - name: installer_type
          in: query
          required: true
          description: Type of installer to download.
          schema:
            $ref: '#/components/schemas/installerType'
      responses:
        200:
          description: Installer file downloaded successfully.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                description: Indicates an example file name
                examples:
                  - attachment; filename="openvpn-connect-3.4.5.1234_signed.dmg"
            Content-Length:
              schema:
                type: integer
                description: Size in bytes of installer file
        400:
          $ref: '#/components/responses/xmlerrorresponse'
        404:
          description: The requested installer file was not found on the server, or an unexpected error occurred while downloading.

  /GetProfileViaToken:
    servers:
      - description: API endpoints with the namespace '/rest/' instead of '/api'
        url: '/rest/'
    get:
      tags:
          - client-import-api
          - profile
      description:
        Downloads a connection profile from Access Server using a one-time string token.

        This endpoint
        requires a valid profile token. See the ProfileDownloadToken schema for more on token usage.

      security:
        - ProfileDownloadToken: [ ]
      parameters:
        - $ref: '#/components/parameters/downloadTokenParameter'
        - $ref: '#/components/parameters/tlsCryptV2CapabilityParameter'
      responses:
          200:
            description: Connection profile downloaded successfully.
            content:
              'application/x-openvpn-profile':
                schema:
                  type: string
                  format: binary
            headers:
              Content-Disposition:
                schema:
                  type: string
                  description: Indicates an example file name
                  examples:
                    - attachment; filename="profile-77723.ovpn"

              VPN-Session-User:
                $ref: '#/components/headers/VPN-Session-User'

              VPN-Session-Token:
                $ref: '#/components/headers/VPN-Session-Token'
          400:
            $ref: '#/components/responses/xmlerrorresponse'


  /GetAutologin:
    servers:
      - description: API endpoints with the namespace '/rest/' instead of '/api'
        url: '/rest/'
    get:
      tags:
          - client-import-api
          - profile
      description: Downloads an autologin connection profile using basic authentication.

        This profile type does not include the `--auth-user-pass directive` and is typically
        used for unattended or persistent VPN connections.
        See also https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#rest-profile-download-api.
      security:
        - ProfileDownloadBasicAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/tlsCryptV2CapabilityParameter'
      responses:
          200:
            description: 'Responds with connection profile file'
            content:
              'application/x-openvpn-profile':
                schema:
                  type: string
                  format: binary
            headers:
              Content-Disposition:
                schema:
                  type: string
                  description: Indicates an example file name
                  examples:
                    - attachment; filename="profile-77723.ovpn"

              VPN-Session-User:
                $ref: '#/components/headers/VPN-Session-User'

              VPN-Session-Token:
                $ref: '#/components/headers/VPN-Session-Token'
          400:
            $ref: '#/components/responses/xmlerrorresponse'

  /GetUserlogin:
    servers:
      - description: API endpoints with the namespace '/rest/' instead of '/api'
        url: '/rest/'
    get:
      tags:
          - client-import-api
          - profile
      description: This endpoint allows a client to download an userlogin profile (a profile requiring user/passwsord
        on connect `--using auth-user-pass`) with basic authentication. See
        also https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#rest-profile-download-api.
      security:
        - ProfileDownloadBasicAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/tlsCryptV2CapabilityParameter'
        - name: device-id
          description: Unique identifier for the client device.
          in: query
          required: false
          schema:
            type: string
      responses:
          200:
            description: Userlogin connection profile downloaded successfully.
            content:
              'application/x-openvpn-profile':
                schema:
                  type: string
                  format: binary
            headers:
              Content-Disposition:
                schema:
                  type: string
                  description: Indicates an example file name
                  examples:
                    - attachment; filename="profile-77723.ovpn"

              VPN-Session-User:
                $ref: '#/components/headers/VPN-Session-User'

              VPN-Session-Token:
                $ref: '#/components/headers/VPN-Session-Token'
          400:
            $ref: '#/components/responses/xmlerrorresponse'

  /GetGeneric:
    servers:
      - description: API endpoints with the namespace '/rest/' instead of '/api'
        url: '/rest/'
    get:
      tags:
          - client-import-api
          - profile
      description: Downloads a generic connection profile using basic authentication.
        This profile is not tied to a specific user and can be used when user-based
        authentication is not required. See also
        https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#rest-profile-download-api.
      security:
        - ProfileDownloadBasicAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/tlsCryptV2CapabilityParameter'
      responses:
          200:
            description: Generic profile downloaded successfully.
            content:
              'application/x-openvpn-profile':
                schema:
                  type: string
                  format: binary
            headers:
              Content-Disposition:
                schema:
                  type: string
                  description: Indicates an example file name
                  examples:
                    - attachment; filename="profile-77723.ovpn"

          400:
            $ref: '#/components/responses/xmlerrorresponse'

  /auth/get-idp-url:
    get:
      tags:
        - saml
        - cws
      description: |
        Returns the IdP URL for redirecting the user and initiating SAML authentication.

        If `relay_state` is not provided, it defaults to `cws`.
      security: []
      parameters:
        - name: relay_state
          in: query
          description: If not set, the relay_state is assumed to be `cws`.
          schema:
            type: string
      responses:
        '200':
          description: Returns the IdP URL to redirect the user for SAML authentication.
          content:
            string:
              schema:
                type: string
                format: url
        '400':
          description: RelayState invalid or SAML configuration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'


  /auth/login/userpassword:
    post:
      tags:
        - auth
        - cws
      description: Authenticates using a username and password. Returns
        an auth token for further requests. Optionally, a TOTP token can
        be provided.
      operationId: authByUserAndPw
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userAndPwLogin'

      responses:
        200:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
          description: Authentication successful. Returns user properties and an auth token.
        401:
          description: MFA is required, or SAML login is expected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  MFAChallenge:
                    $ref: '#/components/schemas/MFAChallenge'
        403:
          description: Invalid credentials or user access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        409:
          description: MFA enrollment is required. Returns an intermediate auth token for enrollment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'


  /auth/login/mfaauth:
    post:
      tags:
        - auth
        - cws
      description: Provides an API to continue the authentication after an MFA challenge.
        This must have the same loginParameters as the original login request.
      operationId: authMFASession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAResponse'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
          description: Authentication successful.
        403:
          description: Invalid MFA response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /auth/login/saml-assertion:
    post:
      tags:
        - auth
        - cws
      description: Authenticates using a SAML assertion. Returns an auth token.
      operationId: authBySAMLAssertion
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/samlLogin'
      responses:
        '200':
          description: Authentication successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponse'
        '403':
          description: Access denied due to user/account restrictions, invalid SAML config, or profile requiring user/password based authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        '401':
          description: 'The authentication assertion could not be processed: the status was unhandled, unknown, or invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        '400':
          description: 'The RelayState is incorrect or the SAML assertion is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /auth/token/renew:
    post:
      tags:
        - auth
        - cws
      description: Provides a new auth token to extend the lifetime of the previous token.
      operationId: authRenewToken
      responses:
        '200':
          description: Token renewed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authTokenResponse'
        '401':
          description: The old token has expired and cannot be renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        '403':
          description: 'Token renewal is no longer allowed.'


  /auth/password/change:
    post:
      tags:
        - auth
        - cws
      description: Allows changing a local user\'s password.

        To verify that the user knows the old password, this endpoint requires an auth
        token issued very recently (within ~30 seconds) or an admin-issued token. Only tokens
        that meet this freshness requirement are accepted.

        After a successful password change, the client must request a new auth token.
      operationId: changePasswordLocalUser
      requestBody:
        content:
          application/json:
            schema:
              required:
                - new_password
              properties:
                username:
                  description: the username the password will be changed for. Will default to the user of the
                    auth token if not present.
                  type: string
                new_password:
                  type: string
                  format: password
                no_session_invalidation:
                  type: boolean
                  description: if set to true changing the password will not invalidate current sessions. (pvt_epoch will not be changed)

      responses:
        200:
          description: 'Password changed successfully.'
          content:
            application/json:
              schema:
                properties:
                  detail:
                    type: string
        401:
          description: 'Authentication failed.'
          content:
            application/json:
              schema:
                properties:
                  detail:
                    type: string
        403:
          description: Auth token is not recent enough, or the new password does not meet security requirements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /auth/mfa/enroll:
    post:
      tags:
        - auth
        - cws
      description: >
        Enrolls a user in MFA using a valid MFA token. If successful, the API returns a
        fully authenticated auth token that can be used without repeating the login or MFA process.

        This returns a fully authenticated auth-token for general use if no target user was provided
        to the API. Otherwise, only the username will  be returned.

        This call also sets the internal totp_locked (pvt_google_auth_secret_locked) flag
        to prevent re-enrollment.
      operationId: enrollUserMFA
      requestBody:
        content:
          application/json:
            schema:
              required:
                - token
              properties:
                token:
                  description: a valid TOTP to prove that the user has successfully configured a TOTP authenticator
                  type: string
                username:
                  description: A target user to test the TOTP token and enroll
                  type: string

      responses:
        200:
          description: MFA enrollment was successful.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/loginResponse'
                  - type: object
                    properties:
                      username:
                        type: string
                        description: username of the enrolled user if username was present in the query.

        400:
          description: Provided MFA token is invalid or enrollment failed for another reason.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'


  /auth/vpn/vpnsaml:
    post:
      tags:
        - vpn
        - saml
      description: Forwards a SAML assertion and relay state to the VPN authentication mechanism.
        This is typically used by the UI to forward an assertion when the relay state starts with `vpnauth~`.
      operationId: vpnAuthSAMLAssertion
      requestBody:
        content:
          application/json:
            schema:
              required:
                - assertion
                - relay_state
              properties:
                assertion:
                  description: SAML Assertion in XML format, encoded as base64-string.
                  type: string
                  format: xml document encoded in base64 format
                relay_state:
                  description: Relay state of SAML assertion request. Required for vpnsaml endpoint
                  type: string
                  examples:
                    - vpnauth~nod1~Dfk3287761d
      responses:
        '200':
          description: The SAML assertion was forwarded successfully.
        '400':
          description: The assertion was invalid, such as an empty string or a malformed request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        '401':
          description: The relay state is incorrect, or the assertion was rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /profiles/list:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profileRequestParameters'
      tags:
        - profile
        - cws
      description: Retrieves a list of all connection profiles for a user.

        Supports optional filtering, sorting, and pagination parameters for
        targeted searches. Filters can match specific fields such as username,
        TLS-Crypt v2 usage, or date ranges. Refer to the request body schema
        for supported filter options.
      operationId: getprofilesuser
      responses:
        200:
          description: Request succeeded. Returns a list of profiles matching the filter criteria.
          content:
            application/json:
              schema:
                type: object
                description: A list of all or subset of profiles
                properties:
                  total:
                    type: integer
                    description: total number of profiles that match
                      if pagination is not in effect, this matches
                      the size of the provided array
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserCertProfile'

  /profiles/create:
    post:
      description: Generates a new connection profile for the specified user.
        Supports profile type selection, optional TLS-Crypt v2 support, and an optional comment.
      tags:
        - profile
        - cws
      operationId: generateUserProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/profileRequest'

      responses:
        201:
          description: Profile created successfully.
          content:
            'application/x-openvpn-profile':
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
                description: Indicates an example file name
                examples:
                  - attachment; filename="profile-77723.ovpn"

            VPN-Session-User:
                $ref: '#/components/headers/VPN-Session-User'

            VPN-Session-Token:
                $ref: '#/components/headers/VPN-Session-Token'


        403:
          description: Profile creation not permitted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /users/defaultuser:
    get:
      description: Retrieves the special meta user, called `__DEFAULT__`, defining defaults for users.
      tags:
        - userprop
        - user
      operationId: getdefaultuserprops
      responses:
        200:
          description: Successfully retrieved the default user configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userPropUserDefault'
        403:
          $ref: '#/components/responses/adminOnly'

  /users/list:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userRequestParameters'
      tags:
        - userprop
        - user
      description: |
        Retrieves a list of user profiles, excluding the default user ("type": "user_default"); use `/users/defaultuser`
        to fetch the default user.
      operationId: getuserprops
      responses:
        200:
          description: Successfully returned user profiles.
          content:
            application/json:
              schema:
                type: object
                description: A list of all or subset of profiles
                properties:
                  total:
                    type: integer
                    description: total number of users that match
                      if pagination is not in effect, this matches
                      the size of the provided array
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/userPropUser'
        403:
          $ref: '#/components/responses/adminOnly'

  /users/create:
    post:
      operationId: createUserPropUser
      tags:
        - userprop
        - user
      description: Creates a new user with the specified properties, but does not create the user if any of the properties are invalid.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userPropUserSet"

      responses:
        201:
          description: New user has been created successfully.
        400:
          description: The user already exists, contains invalid characters, a group with the same name exists, or one of the specified user properties is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /groups/list:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/groupRequestParameters'
      tags:
        - group
        - userprop
      description: Retrieves a list of groups based on optional filters.
      operationId: getgroupuserprops
      responses:
        200:
          description: Successfully retrieved group information.
          content:
            application/json:
              schema:
                type: object
                description: A list of all or subset of profiles
                properties:
                  total:
                    type: integer
                    description: total number of users that match
                      if pagination is not in effect, this matches
                      the size of the provided array
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/userPropGroup'
        400:
          description: One or more arguments in the request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /groups/create:
    post:
      operationId: createUserPropGroup
      tags:
        - userprop
        - group
      description: Creates a new group entry with the specified user property values.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/userPropGroupSet"
      responses:
        201:
          description: 'New group has been successfully created'
        400:
          description: The group already exists, contains invalid characters, conflicts with an existing user name, or includes invalid property values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /userprop/access/list:
    post:
      operationId: listAccessLists
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/accessListRequestParameters'
      tags:
        - userprop
      description: |
        Returns a filtered list of user access properties related to
        routing, including `access_to_ipv4`, `access_to_ipv6`, `access_from_ipv4`, and `access_from_ipv6`.

        Due to database limitations, this endpoint provides a workaround to expose
        these properties for the current design.

        Note: This endpoint is subject to significant changes or
        deprecation in a future Access Server release.

        This is an API to provide access and filtering of
        access_to_ipv4, access_to_ipv6, access_from_ipv4, and access_from_ipv6 user properties.
      responses:
        200:
          description: 'Success'
          content:
            application/json:
              schema:
                type: object
                description: A list of all matching access lists
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: '#/components/schemas/accessRouteListItem'
        403:
          $ref: '#/components/responses/adminOnly'

  /userprop/access/set:
    post:
      tags:
        - userprop
      operationId: setAccessLists
      description:
        Sets or deletes user or group access list properties. To delete a property, set its
        value to `null`. Use `items_append` and `items_remove` to add or remove specific
        access routes without modifying the full list.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Sets user properties to the specified value. If the the access_route is set to 'null' all rules of that type (access_from_ipv4, ... ) are deleted instead. When multiple items of the same type are specified for a user/group then they will be set as list for that user/group
              properties:
                items_set:
                  items:
                    $ref: "#/components/schemas/accessRouteListItem"
                  examples:
                    - [{ 'username': 'johann', access_route: { 'type': 'route', 'accept': 'true', 'subnet': { 'ipv6': true, 'prefix_length': 64, 'netip': '2001:bach:ce1:10::0'} }}, {'username': 'wolfgang', access_route: null, 'type': 'access_to_ipv4'} ]
              items_remove:
                type: array
                description: This will search the access list rules first entry that matches and leave only
                  those userprops in the list that are are not specified by the user props in this list.
                items:
                  $ref: "#/components/schemas/accessRouteListItem"
              items_append:
                type: array
                description: This will append all the specified access rule to the user/group.
                items:
                  $ref: "#/components/schemas/accessRouteListItem"
      responses:
        200:
          description: Successfully set or removed access rules.
        400:
          description: The request was malformed or referenced users/groups do not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rulesets/list:
    post:
      tags: [userprop]
      operationId: listAccessRulesets
      description:
        Request rulesets of a user, a group or the global one. Rulesets can be filtered by name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                owner:
                  description: The assignee username, groupname, or "__DEFAULT__" for the global ruleset.
                  type: string
                filters:
                  description: The string filter to be applied to the ruleset name.
                  type: object
                  properties:
                    name:
                      $ref: '#/components/schemas/filterString'
              examples:
                - { 'owner': 'openvpn', 'filters': { 'name': { 'operation': 'substring', 'value': 'wheel' } } }
      responses:
        200:
          description: The request was successful.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rulesets:
                    description: Array of rulesets assigned to the 'owner' given in the request.
                    type: array
                    items:
                      $ref: '#/components/schemas/accessControlResponseRuleset'
                required: [rulesets]
                examples:
                  - { "rulesets": [ { "id": 1, "name": "NATed domains", "position": 99, "comment": "bla" }, { "id": 3, "name": "other domains", "position": 1000, "comment": "good one" } ] }
        400:
          description: The request was malformed or referenced users/groups do not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rulesets/add:
    post:
      tags: [userprop]
      operationId: addAccessRulesets
      description:
        Add a new ruleset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: The name of the ruleset.
                  type: string
                comment:
                  description: The comment for the ruleset.
                  type: string
              required: [name, comment]
              examples:
                - { "name": "NATed Domains", "comment": "updated 14.03.2025" }
      responses:
        200:
          description: The ruleset was added successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    description: The ID assigned to the new ruleset.
                    type: integer
                required: [id]
                examples:
                  - { "id": 236 }
        400:
          description: The request was malformed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rulesets/update:
    post:
      tags: [userprop]
      operationId: updateAccessRulesets
      description:
        Update an existing ruleset.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  description: The ID of the ruleset to update.
                  type: integer
                name:
                  description: The updated name of the ruleset.
                  type: string
                comment:
                  description: The updated comment for the ruleset.
                  type: string
              required: [id, name, comment]
              examples:
                - { "id": 236, "name": "NAT'd Domains", "comment": "updated 19.03.2025" }
      responses:
        200:
          description: The ruleset was updated successfully.
        400:
          description: The request was malformed or referenced ruleset does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rulesets/delete:
    post:
      tags: [userprop]
      operationId: deleteAccessRulesets
      description:
        Delete existing rulesets.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  description: Array of IDs of the rulesets to delete.
                  type: array
                  items:
                    type: integer
                  minItems: 1
              required: [ids]
              examples:
                - { "ids": [236, 44] }
      responses:
        200:
          description: The ruleset was deleted successfully or did not exist in the first place.
        400:
          description: The request was malformed or referenced ruleset does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/user-rulesets/modify:
    post:
      tags: [userprop]
      operationId: modifyAccessUserRulesets
      description:
        Modify user to ruleset mappings. You can add, update and delete multiple rulesets for multiple users in one request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  $ref: '#/components/schemas/userRulesetsAddMap'
                delete:
                  $ref: '#/components/schemas/userRulesetsDeleteMap'
              examples:
                - { "add": { "bernd": [ { "ruleset_id": 1, "position": 100 }, { "ruleset_id": 2, "position": 200 } ] }, "delete": { "bernd": { "ruleset_ids": [1, 2] }, "amira": { "ruleset_ids": [11] } } }
      responses:
        200:
          description: The mappings were modified.
        400:
          description: The request was malformed or referenced ruleset does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rules/list:
    post:
      tags: [userprop]
      operationId: listAccessRules
      description:
        Request the rules of one or more ruleset. Rules can be filtered by type, match_type and match_data.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ruleset_ids:
                  description: The IDs of the rulesets to list the rules for.
                  type: array
                  items:
                    type: integer
                  minItems: 1
                filters:
                  type: object
                  properties:
                    type:
                      $ref: '#/components/schemas/filterAccessRuleType'
                    match_type:
                      $ref: '#/components/schemas/filterAccessRuleMatchType'
                    match_data:
                      $ref: '#/components/schemas/filterString'
              required: [ruleset_ids]
              examples:
                - { "filters": { "type": { "operation": "equal", "value": "domain_routing" }, "match_type": { "operation": "not_equal", "value": "domain_or_subdomain" }, "match_data": { "operation": "substring", "value": "doggo" } }, "ruleset_ids": [1] }
      responses:
        200:
          description: The rules were retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rules:
                    description: The list of rules requested.
                    type: array
                    items:
                      $ref: '#/components/schemas/existingAccessControlRule'
                required: [rules]
                examples:
                  - { "rules": [ { "id": 1, "ruleset_id": 1, "type": "domain_routing", "match_type": "domain_or_subdomain", "match_data": "doggo.com", "action": "deny", "position": 5000, "comment": "my cat's favorite rule" } ] }
        400:
          description: The request was malformed or referenced ruleset does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /access/rules/modify:
    post:
      tags: [userprop]
      operationId: modifyAccessRules
      description:
        Modify access control rules. You can add, update, and delete multiple rules in one request.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  description: A list of new or updated rules.
                  type: array
                  items:
                    oneOf:
                      - $ref: '#/components/schemas/newAccessControlRule'
                      - $ref: '#/components/schemas/existingAccessControlRule'
                delete:
                  type: array
                  items:
                    type: integer
                  minItems: 1
              examples:
                - { "add": [ { "id": 1, "ruleset_id": 1, "type": "domain_routing", "match_type": "domain_or_subdomain", "match_data": "doggo.com", "action": "deny", "position": 10000, "comment": "my cat's favorite rule" }, { "ruleset_id": 1, "type": "domain_routing", "match_type": "domain", "match_data": "abuse.doggo.com", "action": "route", "position": 5000, "comment": "my cat's fine with this" } ], "delete": [ 2, 3 ]}
      responses:
        200:
          description: The rules were modified successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added:
                    description: The list of IDs for added / updated rules. They appear in the same order as the rules were in the request.
                    type: array
                    items:
                      type: integer
                required: [added]
                examples:
                  - { "added": [1, 4] }
        400:
          description: The request was malformed or referenced ruleset does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'

  /users/delete:
    post:
      description: |
        Deletes the entire user or group userprop entry along with all associated attributes.

        This does not delete any associated profiles. These must be removed separately using
        the `/profile/delete` endpoint.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  description: users name list to delete.
                  items:
                    $ref: '#/components/schemas/username'
      tags:
        - userprop
      responses:
        204:
          description: Userprop was deleted successfully.
        400:
          description: Invalid request arguments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: The specified userprop entry does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /groups/delete:
    post:
      description: Deletes the entire group userprop entry along with all associated attributes.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                groups:
                  type: array
                  description: users name list to delete.
                  items:
                    $ref: '#/components/schemas/groupname'
      tags:
        - userprop
      responses:
        204:
          description: Group userprop was deleted successfully.
        400:
          description: Invalid request arguments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: The specified group userprop entry does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'


  /userprop/mfa/generate-secret:
    post:
      description: Generates a TOTP
        The name must belong to a user
      tags:
        - user
        - userprop
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  $ref: '#/components/schemas/username'
                reset_secret:
                  description: When set to false, a user that already has a token, the function will not
                    generate a new secret. If not present, reset_secret is assumed to be false.
                  type: boolean
                locked:
                  description: When reset_locked is set to true, this will be set the newed locked status
                  type: boolean

      responses:
        200:
          description: Operation successfully finished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp_secret:
                    type: string
                    description: the RFC 6238 TOTP secret to allow enrollment of the user.

        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: user not found


  /userprop/set:
    post:
      description: |
        Sets or deletes user properties for one or more users.

        Setting a property value to null deletes the property and reverts it to its inherited value.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: Sets user properties to the specified value. If a userprop is set to 'null' it is deleted
                instead.
              items:
                oneOf:
                 - $ref: "#/components/schemas/userPropUserSet"
                 - $ref: "#/components/schemas/userPropGroupSet"
                 - $ref: "#/components/schemas/userPropUserDefaultSet"
              examples:
                - "[{ 'name': 'bob', 'auth_method': 'saml'}, {'name': 'bob', 'autologin': false, pw_strength: null }]"


      operationId: modifyUserPropGroupBulk
      tags:
        - userprop
      responses:
        200:
          description: User property changes applied successfully.
        400:
          description: One or more properties are invalid, improperly typed (boolean vs string),
            or not applicable (group only attribute on a user or vice versa) to the specified user(s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: user or group does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /token-url:
    post:
      tags:
        - profile
        - profiletoken
        - cws
      operationId: generateTokenUrl
      description:
        Generates a one-time-use token URL to download a
        connection profile for a specific user or create an
        `openvpn-import://` link for OpenVPN clients.

        This endpoint requires an admin token if token
        lifetime or usage limits are specified.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/tokenRequestParameters'
      responses:
        200:
          description: 'Token URL generated successfully.'
          content:
            application/json:
              schema:
                type: string
                format: uri
        400:
          description: Token url could not be generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /token-url/list:  # To be implemented later, in AS 3.1.* versions
    get:
      operationId: enumerateTokenIds
      description: Returns all currently valid profile token URLs known to the server.
        This endpoint does not support filtering and always returns the complete
        list of active token entries.
      tags:
        - profile
        - profiletoken
      responses:
        200:
          description: List of all valid profile token URLs.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profileTokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/profileToken'

        403:
          $ref: '#/components/responses/adminOnly'

  /token-url/delete:  # To be implemented later, in AS 3.1.* versions
    post:
      description: Delete multiple profile token URLs by providing their token IDs.

        The request will only succeed if all token IDs are found.
      operationId: bulktokenurldelete
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                type: string

      tags:
        - profiletoken
        - profile
      responses:
        204:
          description: Token were successfully deleted
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: One or more token IDs were not found. No tokens were deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /profiles/delete/{serial}:
    post:
      description: Delete a specific profile by its serial number identifier.
      tags:
        - profile
        - cws
      operationId: deleteProfileSerial
      parameters:
        - name: serial
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/certificateSerial'
      responses:
        200:
          description: The profile was successfully deleted.
          $ref: '#/components/responses/deleteResponse'

        400:
          description: The profile could not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /profiles/delete-user:
    description: Deletes all profiles of one or more users.
    post:
      tags:
        - profile
        - cws
      operationId: deleteProfileUser
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                users:
                  type: array
                  description: user name list whose connection profiles will be deleted.
                  items:
                    $ref: '#/components/schemas/username'
                filter:
                  type: string
                  description: will delete all profiles that have the argument as a substring
      responses:
        200:
          $ref: '#/components/responses/deleteResponse'
        400:
          description: The user profiles were not deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        404:
          description: The user profiles were not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /profiles/delete:
    post:
      description: Delete one or more profiles by providing their serial numbers.
      requestBody:
        content:
          application/json:
            schema:
              type: array
              description: array of profile serial numbers to be deleted
              items:
                $ref: '#/components/schemas/certificateSerial'
      tags:
        - profile
        - cws
      operationId: deleteProfile

      responses:
        200:
          description: The request was successfully executed. The status for each profile is included in the response.
          content:
            application/json:
              schema:
                required:
                  - response
                properties:
                  message:
                    description: describes status of deletion
                  response:
                    description: hash map that maps the requested delete request to a result
                    add: object
                    additionalProperties:
                      $ref: '#/components/schemas/profileDeleteCode'
                    examples:
                      - {7127317: 404, 21: 204}
        400:
          description: could not delete the profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /installer-url:
    description: Generate an installer URL to download OpenVPN Connect.
    post:
      operationId: generateInstallerUrl
      tags:
        - cws
        - profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/installerProfileRequest'

      responses:
        200:
          description: Installer URL was successfully generated.
          content:
            application/json:
              schema:
                type: string
                format: url
                examples:
                  - 'https://hostname/rest/GetInstallerViaToken?token=one-time-token'
        400:
          description: Returned if the installer URL generation failed.

            This can happen if the generation of the URL is not permitted, the
            requested installer is not downloadable, or if the server cannot locate
            the required OpenVPN Connect installer file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /config-profile/list:
    get:
      description: Returns the name of the currently active configuration profile and a list of all available profiles.
      tags:
        - configurationProfile
      operationId: enumerateConfigurationProfileList
      responses:
        200:
          description: "A list of all configuration profiles on Access Server"
          content:
            application/json:
              schema:
                type: object
                properties:
                  active_profile:
                    $ref: '#/components/schemas/configurationProfile'
                  profiles:
                    description: "A list of all configuration profiles on Access Server"
                    type: array
                    items:
                      $ref: '#/components/schemas/configurationProfile'
                examples:
                  - { 'active_profile': 'default', profiles: [ 'default', 'heaven', 'hades', 'olymp' ] }

        403:
          $ref: '#/components/responses/adminOnly'

  /config-profile/{profile}:
    delete:
      description: Deletes a configuration profile if it exists and is not currently active.
      operationId: configurationProfileDelete
      tags:
        - configurationProfile
      parameters:
        - name: profile
          in: path
          required: true
          schema:
            $ref:
              '#/components/schemas/configurationProfile'
      responses:
        204:
          description: Configuration profile was successfully deleted
        404:
          description: Specified configuration profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        400:
          description: profile deletion would violate some constraints like deleting the active
            profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'
  /config-profile:
    post:
      operationId: configurationProfileCreate
      tags:
        - configurationProfile
      description: Creates a new configuration profile, optionally coppying the initial values
        from an other profile if the `copyFrom` parameter is present.

        Otherwise the new configuration profile will be empty.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile
              properties:
                profile:
                  $ref: '#/components/schemas/configurationProfile'
                copy_from:
                  $ref: '#/components/schemas/configurationProfile'
      responses:
        201:
          description: The configuration profile was created successfully.
        404:
          description: The specified `copy_from` configuration profile does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        400:
          description: The profile name is invalid, or another error occurred during creation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /config-profile/{profile}/validate:
    get:
      tags:
        - configurationProfile
      parameters:
        - name: profile
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/configurationProfile'
      description: Validates the specified configuration profile and returns any detected errors.
      operationId: validateConfigProfile
      responses:
        200:
          description: The configuration profile is valid with no detected errors.
        404:
          description: Configuration profile does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        400:
          description: The profile contains validation issues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'


  /config-profile/{profile}/set-active:
    post:
      description: Validates the specified configuration profile and, if valid, sets it as the active profile
        and restarts OpenVPN Access Server using the selected restart mode.
      tags:
        - configurationProfile
      parameters:
        - name: profile
          description: The name of the profile to activate.
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/configurationProfile'
        - name: restartMode
          description: The restart mode that should be used to restart the server.
          in: query
          schema:
            $ref: '#/components/schemas/restartMode'
      operationId: RunSetActiveProfile
      responses:
        200:
          description: Success. No errors in the profile are detected and the new profile is
            being set.
        400:
          description: validation of the profile encountered some problems or some other error
            occurred. See error reason for more details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        404:
          description: the requested configuration profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'


  /config-items/{configurationProfile}/list:
    description: |
      Returns a list of configuration items for the specified profile.

      If no names are provided in the request body, all available configuration options (typically <500) are returned.
      Pagination is not supported.
    post:
      tags:
        - configurationProfile
      parameters:
        - name: configurationProfile
          description: The name of the configuration profile to list items from.
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/configurationProfile'

      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    names:
                      description: will return the list of specified configuration keys
                      type: array
                      items:
                        $ref: '#/components/schemas/configurationItemKey'
                - type: object
      description: fetches a list of specified configuration values or all if names is not given. The total amount
        for all item is limited by the number of available configuration options (<500) in Access Server, so no pagination is
        provided in this API.
      operationId: getConfigItems
      responses:
        200:
          description: The list of configuration items was successfully returned.
          content:
            application/json:
              schema:
                type: object
                description: A list of all or subset of profiles
                properties:
                  total:
                    type: integer
                    description: total number of profiles that match
                      if pagination is not in effect, this matches
                      the size of the provided array
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/configurationItem'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: Configuration profile does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'

  /config-items/{configurationProfile}:
    post:
      tags:
        - configurationProfile
      description: |
        Sets or updates configuration items for the specified profile.

        This is an atomic operation: all changes must succeed or none will be applied.
        Setting a value to null deletes it, reverting to the default value.
      parameters:
        - name: configurationProfile
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/configurationProfile'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
            example:
              { 'foo.bar': 17, 'server.name': "foobar", "tls.version.min": null }

      responses:
        200:
          description: Configuration items were updated successfully.
        400:
          description: One or more configuration values are invalid; no changes were made.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          description:
            'User does not have the permission set configuration items'
          $ref: '#/components/responses/adminOnly'
        404:
          description: Configuration profile does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /ca/vpn/list:
    get:
      description: Retrieve a list of all CAs used for VPN server and client certificates.
      tags:
        - vpnca
      operationId: getVPNCas
      responses:
        200:
          description: The request was successful. The response includes an array of CAs with details.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/certificateAuthorityDetails'
        403:
          $ref: '#/components/responses/adminOnly'

  /ca/vpn/create:
    post:
      tags:
        - vpnca
      operationId: addCaGeneration
      description: Create a new CA for VPN server and client certificates.

        This will also automatically generate the necessary cross-signed certificates.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/certificateRequest'

      responses:
        201:
          description: 'The new CA was successfully created'
        403:
          $ref: '#/components/responses/adminOnly'
        400:
          description: The request was invalid.

            This may occur if the selected algorithm is not allowed, the common name
            is too long, contains invalid characters, or already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /ca/vpn/{serial}:
    delete:
      tags:
        - vpnca
      description: Delete a VPN certificate authority (CA) by serial number.

        If the CA still has client certificates, deletion will fail
        unless the `delete_clients` parameter is set to true.

      parameters:
        - name: serial
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/certificateSerial'
        - name: delete_clients
          in: query
          required: false
          description: will force the deletion of the CA (and all client certificates)
          schema:
            type: boolean
      responses:
        200:
          description: 'The CA was successfully deleted'
        400:
          description: The CA could not be deleted.

            This may occur if the CA still has client certificates or if it is
            the only CA in the system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: 'The specified CA was not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'


  /ca/allowed-algorithms/list:
    get:
      description: Retrieve a list of supported cryptographic private/public key
        algorithms that can be used to generate new certificates and certificate authorities (CA).
      tags:
        - vpnca
      operationId: CaSupportedAlgorithms
      responses:
        200:
          description: Returns a list of allowed public/private key algorithms.
          content:
            'application/json':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/certificateAlgorithm'
              example:
                [ 'rsa2048', 'rsa3072', 'rsa4096', 'ed448', 'brainpoolP384r1', 'brainpoolP512r1', 'secp2256k1', 'Ed25519' ]
        403:
          $ref: '#/components/responses/adminOnly'

  /certificate/info:
    post:
      description:
        Parse a PEM-encoded certificate and return detailed information about its properties.

        This endpoint is restricted to admin users to prevent potential security issues
        with the backend\'s X.509 parser.

        Use this endpoint to inspect certificates used in configurations, such as SAML
        and web certificates.
      operationId: certificateInfo
      tags:
        - info
        - certificate
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                certificate:
                  $ref: '#/components/schemas/pemEncodedCertificate'
      responses:
        200:
          description: Returns detailed information about the X509 certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/certificateInformationDetails'

        400:
          description: The provided certificate could not be parsed, or encountered other problems.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          description: "only admin users are allowed to use this API"

  /certificate/create:
    post:
      tags:
        - certificate
      description: Generates a certificate and key pair.

        This certificate ca be either self-signed or signed by a provided
        certificate authority (CA) and a matching CA key.

        The resulting certificate can be used as the self-signed SP certificate
        for the SAML configuration or as a self-signed web server certificate.

        Note, that self-signed certificates must have either 'spcert' or 'ca'
        as cert_template, other types of certificates require a signing ca to
        be provided.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/certificateCreateRequest'
      responses:
        200:
          description: Certificate has been generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  certificate:
                    $ref: '#/components/schemas/pemEncodedCertificate'
                  private_key:
                    $ref: '#/components/schemas/pemEncodedPrivateKey'

        400:
          description: there was some error while trying to generate the certificate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: "#/components/responses/adminOnly"


  /certificate/check-private-key:
    post:
      description: Parse a PEM-encoded certificate and a private key, and verify if they match.

        Provide the private key directly using the `private_key` attribute, or as a reference
        to a configuration key with the `config_key` parameter.
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    certificate:
                      $ref: '#/components/schemas/pemEncodedCertificate'
                    private_key_passphrase:
                      type: string
                      description: passhprase for the certificate's private key
                - oneOf:
                  - type: object
                    properties:
                      private_key:
                        $ref: '#/components/schemas/pemEncodedPrivateKey'
                  - type: object
                    properties:
                      config_key:
                        description: the name of a configuration key (e.g. cs.priv.key)
                          that will be used to check the certificate validity

      tags:
        - info
        - certificate
      operationId: checkPrivateKey
      responses:
        200:
          description: Both the private key and certificate were successfully parsed. The response indicates whether the private key matches the certificate.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                    description: true if the private key matches the certificate
        400:
          description: The certificate or private key could not be parsed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: "#/components/responses/adminOnly"

  /certificate/check-against-ca-roots:
    post:
      tags:
        - info
        - certificate
      description:
        Verify a certificate against a provided list of CA certificates. If no CA certificates are provided,
        the system uses a built-in collection of common CAs trusted by browsers and operating systems.

        It will assume that the certificate(s) in the parameter `chain` are part of the required certificate chain.

        The function will first check that certificate and chain build a chain by checking if each certificates in chain
        signs the previous and then ultimately if the last certificate or second-to-last certificate of the chain
        is signed by one of the CAs in `ca_roots`. This checking both the last and second-to-last certificate
        is done since ca chains that are provided very commonly contains the CA itself or lack it.

        Note this function *only* establishes if there is a path that lead from the certificate to one of the
        root CAs. It does not check any other requirement that certificate typically have to considered valid.
        This includes but is not limited to checking if the certificates in the chain are intermediate CAs that
        are actually allowed to sign certificates, the keyUsage and extendedKeyUsage of the involved certificates
        or revocation.

        If the certificate contains multiple certificate the first certificate is considered to be the certificate
        to be checked and the other ones are considered to be intermediate certificates of the certificate chain
        and are treated the same way as the certificate(s) in the chain property.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - certificate
              properties:
                certificate:
                  $ref: '#/components/schemas/pemEncodedCertificate'
                chain:
                  $ref: '#/components/schemas/pemEncodedCertificate'
                ca_roots:
                  type: array
                  description: a list of CA certificates that should be used as trusted certificate
                    authorities. If left empty AS will use the system certificates root CAs. This
                    are very similar but not always identical to a browser trust store.
                  items:
                    $ref: '#/components/schemas/pemEncodedCertificate'
      responses:
        200:
          description: The certificate has been successfully verified against the provided CA certificates.
            The response contains the trust chain that was found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  chain:
                    type: array
                    items:
                      $ref: "#/components/schemas/certificateInformationDetails"

        400:
          description: The certificate failed verification. Details are provided in the response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /support/report:
    get:
      tags:
        - maintenance
        - support
      description: |
        Generates a support report for Access Server, containing commonly requested
        diagnostic information to assist with troubleshooting.

        This operating is resource-intensive, as it executes external programs to gather system data,
        and may take some time to complete. Use this endpoint only when necessary.
      responses:
        200:
          description: Support report generated successfully. The output is the same as running `sacli support`.
          content:
            text/plain:
              schema:
                description: Diagnostic
                type: string
        403:
          $ref: '#/components/responses/adminOnly'


  /proxy:
    post:
      tags:
      - proxy
      parameters:
        - $ref: '#/components/parameters/backendSelection'
      description: |
        This is not a real API endpoint, but a documentation placeholder to explain the
        proxy mechanism used by OpenVPN Access Server in a clustered setup.

        Most API endpoints in Access Server support proxying requests to other backend
        nodes in the cluster. When a request includes the `X-OpenVPN-AS-Node` header,
        the middleware checks if the specified node name matches a known backend server.
        See the `/cluster/nodes/list` endpoint for retrieving all backend servers.
        If it matches, the request is proxied to that node, and the response is
        forwarded back to the client.

        The proxied request will include:

          - X-Forwarded-For: The original client's IP address.
          - X-Forwarded-Host: The node name that forwarded the request.

        If a node receives a request where its own name appears in the `X-Forwarded-Host`
        header, this indicates a loop (typically caused by incorrect DNS or cluster configuration).
        In such cases, the request fails with an error.

        Authentication and validation are not performed by the proxy. The middleware only ensures
        the target is a valid backend server. Responses described here may occur
        in addition to standard endpoint responses when proxying is in use.
      responses:
        504:
          description: Proxying the request to the target node timed out.
        502:
          description: Communication problem with the target backend
            node (other than a timeout) or the X-OpenVPN-AS-Node is not in
            the list of backend servers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /eula:
    get:
      tags:
        - info
      description: Retrieve the current end-user license agreement (EULA) and the acceptance status
        for the user. The EULA is considered accepted if the `aui.eula_version` matches the `eula_version_as`
        returned by this endpoint.
      responses:
        200:
          description: Returns the current EULA, its version, and whether the user has accepted it.
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      eula:
                        type: string
                        examples: ['Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ...']
                      eula_web:
                        type: string
                        examples: ['Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ...']
                  - $ref: '#/components/schemas/eulaStatus'

        403:
          $ref: '#/components/responses/adminOnly'

  /server/restart:
    post:
      tags:
        - maintenance
      description: instructs the backend to be restarted
      parameters:
        - name: restartMode
          in: query
          schema:
            $ref: '#/components/schemas/restartMode'
        - name: group
          description: for the warm restart mode, this limits the services to the listed groups
            to be restarted
          in: query
          schema:
            type: string
            examples:
              - web_group
      responses:
        200:
          description: Server restart successfully scheduled
        400:
          description: Server has some misconfiguration and restart is not scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
          description:
            User does not have admin permission

  /server/status:
    get:
      operationId: serverStatus
      tags:
        - maintenance
        - info
      description: Retrieves the current status of the server and its individual services.

        The output is similar to the result of running `sacli Status`, which shows the status of the internal Access Server service.
      responses:
        200:
          description: Server and status returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverStatus'
        403:
          description:
            User does not have admin permission

  /server/interfaces:
    get:
      operationId: serverInterfaces
      tags:
        - info
      description: Retrieves a list of network interfaces on the server and their assigned IP addresses.
      parameters:
        - name: no_loopback
          in: query
          required: false
          description: if true exclude loopback interfaces
          schema:
            type: boolean
      responses:
        200:
          description: A list of network interfaces and their assigned IP and IPv6 addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/serverInterface'
        403:
          description:
            User does not have admin permission

  /server/info:
    get:
      tags:
        - info
      description: Provides a summary of the runtime status of the Access Server instance, including version information, web components, OS details and system architecture.
      responses:
        200:
          description: Returns information about the running Access Server instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverInfo'
        403:
          description: "only admin users are allowed to use this API"

  /server/failover-test:
    post:
      tags:
        - maintainance
        - server
      description: runs a number of tests to valdiate a failover configuration.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                  type: string
              description: the values of the configuration keys to use when testing a configuration for validity. The format of
                the keys is the same as for the  /config-items/{configurationProfile}/ post API and the fail over test needs
                the keys `dbpush.*`, `ucarp.*`, and `failover.mode`
              examples:
                - {"failover.mode": "ucarp",
                   "ucarp.addr": "192.168.188.254",
                   "ucarp.secret": "sharedsecret",
                   "dbpush.hosts.0.enable": "true",
                   "dbpush.hosts.0.public": "grace.hopper",
                   "dbpush.hosts.0.internal": "PRIMARY",
                   "dbpush.hosts.0.username": "root",

                   "dbpush.hosts.1.enable": "true",
                   "dbpush.hosts.1.public": "ada.lovelace",
                   "dbpush.hosts.1.internal": "SECONDARY",
                   "dbpush.hosts.1.username": "root",
                   "dbpush.hosts.1.password": "",
                   "dbpush.hosts.1.ssh_port": "22"
                  }
      responses:
        200:
          description: Results of the failoover test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/failOverTestStatus'
        400:
          description: Failover test initialisation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'
        403:
         $ref: "#/components/responses/adminOnly"


  /server/failover-init:
    post:
      tags:
        - maintainance
        - server
      description: initialises the failover configuration for the secondary node. The configuration
        should be first validated by the /server/failover-test API call. If no old configuration exists
        use the new configuration for both old and new configuration. After this call has successfully
        finished, a /server/restart with systemctl needs to be called (with a delay of 10s or similar).

        In order for failover to properly work, the webserver certificates should be moved to the config
        DB and not referenced by their filename.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_config:
                  type: object
                  additionalProperties:
                    type: string
                  description: the values of the configuration keys to use for the new configuration  The format of
                    the keys is the same as for the  /config-items/{configurationProfile}/ post API and the fail over test needs
                    the keys `dbpush.*`, `ucarp.*`, and `failover.mode`
                  examples:
                    - { "failover.mode": "ucarp",
                        "ucarp.addr": "192.168.188.254",
                        "ucarp.secret": "sharedsecret",
                        "dbpush.hosts.0.enable": "true",
                        "dbpush.hosts.0.public": "grace.hopper",
                        "dbpush.hosts.0.internal": "PRIMARY",
                        "dbpush.hosts.0.username": "root",

                        "dbpush.hosts.1.enable": "true",
                        "dbpush.hosts.1.public": "ada.lovelace",
                        "dbpush.hosts.1.internal": "SECONDARY",
                        "dbpush.hosts.1.username": "root",
                        "dbpush.hosts.1.password": "",
                        "dbpush.hosts.1.ssh_port": "22"
                    }
                old_config:
                  type: object
                  description: The old configuration. This be needed as the old failover node
                    might be different from new failover node. Format is the same as new_config
                  additionalProperties:
                    type: string
      responses:
        200:
          description: Secondary node setup was successful.
        400:
          description: Something went wrong during secondary node setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: "#/components/responses/adminOnly"


  /vpn/status:
    get:
      tags:
        - vpn
        - info
      description: Retrieves the OpenVPN server status, including currently connected clients and information about the OpenVPN daemon(s).
        This endpoint always returns the full dataset for all VPN clients and daemons.
        Pagination is not supported, as limiting the response would require dropping
        already retrieved information, with minimal benefit in reduced data transfer.
      responses:
        200:
          description: Returns the VPN server status and client connection details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  vpn_clients:
                    description: List of connected VPN clients
                    type: array
                    items:
                      $ref: '#/components/schemas/connectedVPNClient'
                  vpn_daemons:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/vpnDaemonStatus'

        403:
          $ref: '#/components/responses/adminOnly'

  /server/config:
    get:
      tags:
        - misc
        - cws
      description: Returns server-wide configuration values that apply to all users. Requires an auth token, but not admin permissions.
      operationId: get_server_config
      responses:
        200:
          description: The global server configuration was retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/serverConfig'

  /server/dns:
    get:
      tags:
        - info
      description: Returns DNS servers configured on the host OS (the same that will be pushed to VPN clients)
      responses:
        200:
          description: DNS servers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    ip_addr:
                      description: IP address of a DNS server
                      type: string
                    ipv6:
                      description: whether this describes an IPv4 or an IPv6 address
                      type: boolean
        403:
          $ref: '#/components/responses/adminOnly'

  /vpn/dco-module:
    get:
      tags:
        - info
      description: Checks with the data-channel offload (DCO) kernel module is available
        and returns the installed module version, if present.
      responses:
        200:
          description: Returns the DCO module status and version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/dcoModuleStatus'
        403:
          $ref: '#/components/responses/adminOnly'


  /vpn/client/disconnect:
    post:
      tags:
        - vpn
      description: Disconnects one or more VPN clients from the server. Either `users` or `clients` must be provided in the request body.
      operationId: disconnectClient
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required:
                    - reason
                    - client_reason
                  properties:
                    reason:
                      $ref: "#/components/schemas/adminReason"
                    client_reason:
                      $ref: "#/components/schemas/clientReason"
                - oneOf:
                  - type: object
                    properties:
                      users:
                        type: array
                        description: A list of users to disconnect
                        items:
                          $ref: "#/components/schemas/username"
                  - type: object
                    properties:
                      clients:
                        type: array
                        description: A list of VPN connections to disconnect.
                        items:
                          $ref: "#/components/schemas/vpnConnectionID"
      responses:
        200:
          description: The specified client(s) were disconnected successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'
        404:
          description: The specified client could not be found by daemon and client ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /log/reports:
    post:
      description: Returns log report entries matching the provided filters. Useful for analysing VPN activity, authentication attempts, client versions, and errors across nodes and users.
      operationId: getLogReports
      tags:
        - logs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/logDBRequestParameters'

      responses:
        200:
          description: Successfully returns log report entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/logDBRecord'
                  total:
                    type: integer
                    description: total number of profiles that match
                      if pagination is not in effect, this matches
                      the size of the provided array
        403:
          $ref: '#/components/responses/adminOnly'
        400:
          description: Invalid filter format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReasonDetail'

  /license/info:
    get:
      description: Retrieves the current licensing status of the Access Server instance,
        including license type, active client connections, and fixed license details if applicable.
      tags:
        - license
      operationId: licenseInfo
      responses:
        200:
          description: Licensing information for the Access Server instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/licenseInfo'
        403:
          $ref: '#/components/responses/adminOnly'

  /license/subscription/test:
    post:
      tags:
        - license
      description: Tests a provided license key against the subscription service and returns the results.

       This call does not configure Access Server to use the subscription. It only validates and retrieves
       subscription details.
      operationId: checkSubscription
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  type: string
                  description: The subscription file. This is either a string containing a json object
                    or a base64 encoding of the json object.
              required:
                - subscription

      responses:
        200:
          description: Subscription test result returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subscriptionInfo'
        400:
          description: The license key format is invalid, or an error occurred while processing the test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'


  /license/subscription:
    post:
      tags:
        - license
      description: Instructs Access Server to use the provided license key for licensing.

        This call does not validate whether the subscription is correct or active. Use the `/license/subscription/test`
        endpoint to check validity before calling this one.

        Submitting a new subscription key with this endpoint will overwrite any existing subscription configuration.
      operationId: loadSubscription
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                subscription:
                  type: string
                  description: The subscription file. This is either a string containing a json object
                    or a base64 encoding of the json object.
              required:
                - subscription
      responses:
        200:
          description: Subscription has been successfully loaded.
        400:
          description: The license key format is invalid, or an error occurred while applying the subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

    delete:
      tags:
        - license
      description: Removes the currently active subscription configuration from the OpenVPN Access Server instance.
      operationId: deactivateSubscription
      responses:
        200:
          description: Subscription has been successfully deactivated.
        403:
          $ref: '#/components/responses/adminOnly'

  /license/fixed-license/online-activation:
    post:
      tags:
        - license
      description: Activates a fixed license key for Access Server by validating the license key with the online licensing service.
      operationId: activateFixedLicenseOnline
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - license
              properties:
                license:
                  type: string
                  description: The license file
      responses:
        200:
          description: Fixed license key successfully activated.
        400:
          description: The license format is invalid, or an error occurred during activation.
          content:
            application/json:
              examples:
                licensenotfound:
                  value: { "message": "License not found on server" }
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /license/fixed-license/offline-activation:
    post:
      tags:
        - license
      description: Activates a fixed license key for Access Server using an uploaded license file. The license file is
        validated during this process.
      operationId: activateFixedLicenseOffline
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                license:
                  type: string
                  description: The license file
              required:
                - license

      responses:
        200:
          description: Fixed license key has been successfully activated.
        400:
          description: The license format is invalid, or an error occurred during activation.
          content:
            application/json:
              examples:
                errormessage:
                  value: { "message": "Fixed license already expired" }

              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /license/machine-id:
    get:
      description: Returns the machine ID file used for licensing purposes in Access Server.
      tags:
        - license
      operationId: licenseGetMachineId
      responses:
        200:
          description: Machine ID file returned successfully.
          content:
            text/plain:
              schema:
                description: this holds a json object but should be treated as a opaque file
                type: string
                format: text
        403:
          $ref: '#/components/responses/adminOnly'

  /notification/create:
    post:
      operationId: notificationCreate
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notificationMessage"
      responses:
        200:
          description: "Successful operation"
        403:
          $ref: '#/components/responses/adminOnly'
        400:
          description: notification creation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

  /cluster/nodes/list:
    get:
      description: Returns a list of all nodes in the cluster, including metadata.

        Allows identifying backend nodes in a clustered Access Server setup.
      tags:
        - cluster
      operationId: clusterListNodes
      responses:
        200:
          description: List of cluster nodes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    description: holds a dictionary of all the nodes that are part of the cluster
                    type: object
                    additionalProperties:
                      allOf:
                      - $ref: '#/components/schemas/clusterNode'
                      - type: object
                        properties:
                          restart_pending:
                            description: Indicates if a node has a pending restart.
                            type: boolean

        403:
          $ref: '#/components/responses/adminOnly'

  /cluster/rr-dns-hostname:
    put:
      description: Sets the `host.name` value in the local configuration database (confdb_local) on
        all nodes in the cluster, using the `rr_dns_hostname` value from the cluster database.
        Ensures consistent DNS naming across a clustered Access Server deployment.

      tags:
        - cluster
      operationId: rrdnshostname
      responses:
        200:
          description: The cluster DNS hostname was updated successfully on all nodes.
        400:
          description: Failed to update the cluster DNS hostname due to a configuration error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /cluster/props:
    get:
      description: Retrieves cluster properties from the cluster database (ClusterDB), such as
        round-robin DNS hostname and related settings.
      tags:
        - cluster
      operationId: clustergetprops
      responses:
        200:
          description: Successfully retrieved cluster properties from the cluster
          content:
            application/json:
              schema:
                type: object
                properties:
                  props:
                    description: holds a dictionary of all props of the cluster
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/clusterProps'
        403:
          $ref: '#/components/responses/adminOnly'
        400:
          description: Getting the cluster properties failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'

    post:
      description:
        Sets cluster properties, such as the round-robin DNS hostname, in the cluster database (ClusterDB).
      tags:
        - cluster
      operationId: clustersetprops
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/clusterProps"
      responses:
        200:
          description: The cluster properties were successfully updated in the database.
        400:
          description: Setting the cluster properties failed.
          content:
            application/json:
              examples:
                invalidchars:
                  value: { "message": "rr_dns_hostname has invalid characters in it" }
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /cluster/{node}/set:
    post:
      description: 'Updates parameters for a specific cluster node. This is an atomic operation: all specified parameters are applied together, or none are applied if any error occurs. Only defined properties in the request body are updated.'
      operationId: clusterset
      parameters:
        - name: node
          in: path
          required: true
          schema:
            type: string
          examples:
            vpn1:
              value: vpn1.example.com
              description: the hostname/identifier of that node
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                api_endpoint:
                  $ref: "#/components/schemas/apiEndpoint"
                certificate_fingerprint:
                  $ref: "#/components/schemas/certificateFingerprint"
      responses:
        200:
          description: Properties on the cluster node have been successfully set.
        400:
          description: Error setting the cluster properties failed
          content:
            application/json:
              example:
                invalidchars:
                  value: { "message": "api_endpoint has invalid characters in it" }
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'


  /cluster/join:
    post:
      tags:
        - cluster
      description: Joins a standalone Access Server instance to an existing cluster.
        If the certificate_fingerprint is not provided, it is automatically calculated
        by the joining node. The cluster must already be set up.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clusterNodeJoinRequest'

      responses:
        200:
          description: The server successfully joined the cluster.
        400:
          description: The server failed to join the cluster.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /cluster/create:
    post:
      tags:
        - cluster
      description: Creates a new cluster using the current server configuration
        as the foundation for the shared cluster database. The current node
        becomes a member of the newly created cluster.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/clusterNodeCreateRequest'
      responses:
        200:
          description: The cluster was created and the current node joined successfully.
        400:
          description: The cluster could not be created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /cluster/leave:
    post:
      description: Removes the current node from the cluster.
      tags:
        - cluster
      responses:
        200:
          description: The node was successfully removed from the cluster.
        400:
          description: The request to leave the cluster failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /database/convert:
    put:
      tags:
        - cluster
      description: |
        Converts local SQLite databases to MySQL and updates the configuration file (as.conf).

        Requires a full Access Server restart for changes to take effect.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/mysqlUriParts"
      responses:
        200:
          description: The database was successfully converted, and the configuration updated.
        400:
          description: The database conversion failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /ui/config:
    get:
      tags:
        - misc
      description: eturns general website configuration details that must always be available (even to unauthenticated calls).
      operationId: getCWSconfig
      # does not require auth
      security: [ ]
      responses:
        '200':
          description: "Successful operation"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebsiteConfig'

  /helper/get-saml-configuration:
    post:
      tags:
        - helper
      description: Parses SAML IdP metadata provided as a string or fetched from a specified URL. Returns configuration items that correspond with the parsed metadata.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: string
                  description: The string that contains SAML Idp metadata in xml format
                url:
                  type: string
                  format: uri
                  description: the url from which the backend will fetch SAML Idp metadata from
              oneOf:
                - required: [data]
                - required: [url]
      responses:
        200:
          description: Successfully parsed and returned SAML configuration items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuration_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/configurationItem'
        400:
          description: Something went wrong parsing the data or fetching the metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorReason"
        403:
          $ref: '#/components/responses/adminOnly'


  /helper/status-overview:
    post:
      tags:
        - info
        - helper
      description: Combines multiple API calls into a single request to provide a consolidated status overview.

        This response includes data from `/config-items/{configurationProfile}/list` for the active profile,
        `/server/info`, `/vpn/dco-module`, and the current EULA status, including the latest version and
        whether the user has accepted it.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                names:
                  description: list of configuration items that should be retrieve from the active configuration
                  type: array
                  items:
                    $ref: '#/components/schemas/configurationItemKey'

      responses:
        200:
          description: Consolidated status overview data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  configuration_items:
                    description: Response from the /config/{activeprofile}/items part of the query
                    properties:
                      total:
                        type: integer
                        description: total number of profiles that match
                          if pagination is not in effect, this matches
                          the size of the provided array
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/configurationItem'
                  server_info:
                    $ref: '#/components/schemas/serverInfo'
                  dco_module:
                    $ref: '#/components/schemas/dcoModuleStatus'
                  eula_status:
                    $ref: '#/components/schemas/eulaStatus'
        400:
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /acme/set-acme-challenge:
    post:
      tags:
        - acme
      description: Provides a list of PEM encoded X509 certificates and servernames that the webserver should present to a client with the
        acme/1 ALPN protocol to allow the tls-alpn-01 ACME challenge to complete.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcmeChallenge'
      responses:
        400:
          description: Something went wrong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /acme/directory:
    get:
      tags:
        - acme
      description: Provides the directory of the currently configured ACME service (acme.url) if no URL
        is provided. Otherwise provides the directory of the ACME on the URL.
      parameters:
        - name: url
          in: query
          description: The URL of an ACME CA service to query the directory for.
          schema:
            type: string
            examples:
              - 'https://acme-v02.api.letsencrypt.org/directory'
              - 'https://dv.acme-v02.test-api.pki.goog/directory'
      responses:
        200:
          description: Consolidated status overview data.
          content:
            application/json:
              schema:
                type: object
                description: The contents of the ACME directory. Refer to RFC 8555 for a description
                  of the format of the directory. (https://datatracker.ietf.org/doc/rfc8555/)
        403:
            $ref: '#/components/responses/adminOnly'

  /acme/register-account:
    post:
      tags:
        - acme
      description: Triggers the registration of an account on the configured ACME service. Please ensure that the
        acme internal service has been restarted to use the current configuration items (acme.*) before triggering this
        function.

        This is a blocking call that may take up to a minute to request the certificate until it will ultimately fail with
        a timeout.
      responses:
        200:
          description: Successfully registered account.
        401:
          description: Failed to register an account with the ACME service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
            $ref: '#/components/responses/adminOnly'

  /acme/request-certificate:
    post:
      tags:
        - acme
      description: Triggers the request of a certificate from the ACME CA service. Ensure that you have registered an account
        before calling this API. The web server should be manually restarted after successfully calling this API to use the
        new certificate.

        This is a blocking call that may take up to a minute to request the certificate until it will ultimately fail with
        a timeout.
      responses:
        200:
          description: Successfully requested certificate.
        401:
          description: Error occurred during the request of the certificate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorReason'
        403:
          $ref: '#/components/responses/adminOnly'

  /acme/revoke-certificate:
    post:
      tags:
        - acme
      description: Triggers the revocation of the current certificate from the ACME CA service.
      responses:
        200:
          description: Successfully revoked the current certificate.
        403:
          $ref: '#/components/responses/adminOnly'

components:
  securitySchemes:
    AuthToken:
      description: This is an opaque token that allows using the authenticated method. The token will expire after a
        certain amount of time unless it is renewed through the renewal API. While we might use a JWT for this, the API
        consumer should not assume anything about the format or content of this string. JWT with default
        encryption/authentication appears not to be FIPS compatible.
      type: apiKey
      in: header
      name: X-OpenVPN-As-AuthToken
    ProfileDownloadToken:
      description: This is a string-token that can be used to download OpenVPN Connection Profile or installer file.
        Typically, e.g. for installer download and OpenVPN connection profile download, this token
        is generated as a token, that can be used only once.
      type: apiKey
      in: query
      name: token
    ProfileDownloadBasicAuth:
      description: a basic auth with user and password. This methods uses a fairly non-standard challenge/resposne
        method if required that is documented under https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#challengeresponse-authentication
      type: http
      scheme: basic

  schemas:
    WebsiteConfig:
      type: object
      description: Website appearance and configuration details that must be available without authentication.
      required:
        - enabled_auth_methods
      properties:
        header_image:
          description: An URI to an alternative header image that is customised. If not present use default logo
          type: [string, "null"]
        hide_footer:
          description: If true then hide footer
          type: [string, "null"]
        enabled_auth_methods:
          description: A list of enabled authentication methods. UI should only offer enabled methods. These are NOT
            the backend methods but rather the ways of providing credentials regardless of the backend authentication
            method.
            The userandpasswordwithmfa method will provide the user with username, password and TOTP field for the login
            to make allow entering both factors in one step instead of two.
          type: array
          examples:
            - [ "saml", "userandpassword" ]
          items:
            type: string
            enum:
              - saml
              - userandpassword
        login_text:
          description: Alternative login text.
          type: [string, "null"]
          examples:
            - Enter your TOTP Authentication code.


    profileType:
      description: Specifies the connection profile type.
      type: string
      enum:
        - autologin
        - userlogin
        - generic
        - epki-generic

    username:
      type: string
      description:
        A case-sensitive username. If this differs from the one associated with the auth token,
        admin privileges may be required for certain operations.
      examples:
        - "niccolo@paganini.it"
        - ludwig

    groupname:
      type: string
      description: Name of a user group used in user management.
        specify a group name.

    installerType:
      description: Specifies the type of the installer binary to be generated.
      type: string
      enum:
        - win_v3
        - mac_v3
        - win
        - mac
        - ios
        - android
        - linux

    certProfileSorting:
      description: Defines the attribute used to sort certificate profiles.
      type: string
      enum:
        - serial
        - username
        - not_before
        - type
        - not_after
        - tls_crypt_v2
        - last_used
        - algorithm

    userSorting:
      description: Defines the attribute used to sort user profiles.
      type: string
      enum:
        - admin
        - name
        - autologin
        - group
        - mfa_status

    groupSorting:
      description: Defines the attribute used to sort groups.
      enum:
        - name
        - admin
        - autologin
        - auth_method
        - mfa_enabled
        - member_count

    logDBSortingFields:
      description: Enum of valid sorting fields for querying the log database.
      type: string
      enum:
        - node
        - username
        - service
        - duration
        - active
        - virtual_ipv4_address
        - bytes_received
        - bytes_sent
        - timestamp
        - error
        - version
        - gui_version
        - platform
        - protocol

    sortingDirection:
      description: The direction in which to sort results (e.g., ascending or descending).
      type: string
      enum:
        - asc
        - desc

    UserCertProfile:
      description: A certificate profile of a user.
      allOf:
        - $ref: '#/components/schemas/certificateDetails'
        - type: object
          description: A profile for a user.
          properties:
            device_id:
              description: Device ID, only used for server-locked v1 profiles
              type: [string, "null"]
            comment:
              description: A user-defined comment
              type: [string, "null"]
              examples:
                - My toaster running Doom
            profile_type:
              $ref: '#/components/schemas/profileType'
            tls_crypt_v2:
              description: This profile uses tls-crypt-v2
              type: boolean
            last_used:
              description: 'Last date this profile was used (only date is known, there is no more granular resolution)'
              type: [string, "null"]
              format: date
            username:
              type: string
              description: "User's name"

    usertype:
      description: Indicates whether the user is an admin.
      type: string
      enum:
        - admin
        - user

    userproperties:
      description: Properties assigned to a user.
      type: object
      required:
        - requires_mfa_enrollment
      properties:
        requires_mfa_enrollment:
          type: boolean
          description: if present, this user needs to finish MFA enrollment
        user_type:
          # the type of the user, this is more informal
          $ref: '#/components/schemas/usertype'
        mfa_secret:
          # TODO: Is this a good place or should this have its separate API?
          description: This is an optional field that is only visible if the user
            has not enrolled yet or is an admin user.
          type: string
        allowed_profiles:
          description: A list of profiles types allowed for the user. Sorted by preference.
          type: array
          items:
            $ref: '#/components/schemas/profileType'
        enforce_strong_passwords:
          type: boolean
          description: If true, than checking for strong password is required.
        allow_password_change:
          type: boolean
          description: Indicates whether password change is allowed for the user.

    MFAChallenge:
      type: object
      required:
        - echo
        - challenge
        - challenge_context
      properties:
        echo:
          type: boolean
          description: If true, the entered code should be displayed in cleartext. Otherwise masked like a password.
        challenge:
          type: string
          description: The text presented to the user when asking for the challenge.
        challenge_context:
          type: string
          description: Often authentication backends require the challenge to be answered in the same session as the
            initial user/password. This allows tying the MFA answer to the initial authentication attempt.
          examples:
            - "FJAIIXMAIOFLGAK23"
      examples:
        - { "challenge": "If you could be any animal, what would you be and why?", "echo": true,
                   "challenge_context": "812jh3a8s" }
        - { "challenge": "Enter your TOTP code", "echo": true, "challenge_context": "FJAIIXMAIOFLGAK23" }


    MFAChallengeResponse:
      type: object
      required:
        - username
      properties:
        response:
          type: string
          format: password
          description: the user's response to the MFA challenge
        challenge_context:
          type: string
          description: The challenge context that was in the MFAChallenge.
          examples:
            - FJAIIXMAIOFLGAK23
        username:
          description: The user name for login
          type: string

    MFAResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/loginParameters'
        - $ref: '#/components/schemas/MFAChallengeResponse'

    certificateSerial:
      type: string
      examples:
       - 1708464983752887'
      format: int64
      description: |
        A string representing the certificate serial number.

        A string is used instead of an integer to avoid issues with large
        values in JavaScript, which cannot reliably handle integers larger than 52 bits.

    certificateCommonName:
      type: [string, "null"]
      description: 'The certificate common name (CN).'
      examples:
        - OpenVPN VPN server CA
        - johan@bach.de

    loginParameters:
      type: object
      properties:
        request_admin:
          type: boolean
          description: Whether this login should request admin privileges. Without this set to true, even admin users will
            not be granted admin privileges after login.

    userAndPw:
      type: object
      required:
        - username
        - password
      properties:
        username:
          description: The user name for login. Note that if this is case-sensitive or not depends on the OpenVPN Access Server configuration.
          type: string
        password:
          description: The password for login in clear text
          type: string
        totp:
          description: Optional TOTP token for the user when wishing to do all MFA credentials in one go.
          type: string


    samlLoginAssertion:
      type: object
      required:
        - assertion
      properties:
        assertion:
          description: SAML Assertion in xml format , encoded as base64-string
          type: string
          format: xml
        relay_state:
          description: Optional relay state identifying the type of SAML request. If not passed or empty, defaults to cws
          type: string
          examples:
            - vpnauth~nod1~Dfk3287761d

    userAndPwLogin:
      type: object
      allOf:
        - $ref: '#/components/schemas/loginParameters'
        - $ref: '#/components/schemas/userAndPw'

    samlLogin:
      type: object
      allOf:
        - $ref: '#/components/schemas/loginParameters'
        - $ref: '#/components/schemas/samlLoginAssertion'

    loginResponse:
      type: object
      allOf:
        - type: object
          required:
            - username
          properties:
            user_properties:
              $ref: '#/components/schemas/userproperties'
            username:
              type: string
              description: username of the authenticated user
        - $ref: '#/components/schemas/authTokenResponse'

    authTokenResponse:
      type: object
      required:
        - auth_token
        - expires_after
        - renewable_until
      properties:
        auth_token:
          type: string
          description: An opaque token that is used to access protected APIs
        expires_after:
          type: string
          description: date in UTC when token expires
          format: "%a %b %d %Y %-H:%-M:%-S GMT%z (%Z)"
        renewable_until:
          type: string
          description: date in UTC when the token is no longer renewable
          format: "%a %b %d %Y %-H:%-M:%-S GMT%z (%Z)"


    profileDeleteCode:
      type: integer
      enum:
        - 204:
          description: 'profile successfully deleted'
        - 404:
          description: 'profile to be deleted was not found'
        - 403:
          description: 'profile to be deleted is not owned by the user or another error'

    clientReason:
      type: string
      description: Message given to the client explaining why it was disconnected.
      examples:
        - "Client disconnected for administrative reasons"


    adminReason:
      type: string
      description: Message logged for administrators explaining why a client was disconnected.
      examples:
        - "John should not be working after hours"

    vpnConnectionID:
      type: object
      required:
        - daemon_id
        - client_id
      properties:
        daemon_id:
          $ref: "#/components/schemas/daemonID"
        client_id:
          $ref: "#/components/schemas/clientID"

    errorReason:
      type: object
      required:
        - reason
      properties:
        reason:
          description: a user-friendly message of reason of API failure, allowed to be displayed
          type: string
          examples:
            - "Your password must not include parts of Cthulhu's chant."
            - Your password must include one letter, one symbol and one space
        title:
          description: a title describing the error message
          type: string
          examples:
            - Password validation failed

    errorReasonDetail:
      description:
        A set of field-specific error messages. Each key in the response corresponds to the input field that caused
        the error. For example, when setting configuration keys, the keys in this object match the configuration
        fields that failed validation.
      allOf:
        - $ref: "#/components/schemas/errorReason"
        - type: object
          properties:
            detail:
              type: object
              description: errorReasons that specify the errorReason for a specific sub object
              additionalProperties:
                $ref: "#/components/schemas/errorReason"
      examples:
        - { 'reason': 'config values had errors', detail: { 'host.name': "Contains invalid character %", "server.port": "Must be an integer between 1 and 65335" } }

    configurationProfile:
      type: string
      description: The configuration profile name. The default profile is typically DEFAULT. Additional
        profiles allow for staging changes or creating backups.

    certificateAlgorithm:
      type: string
      description: Specifies the algorithm used for private/public key pair in an X.509 certificate.
        This is an identifier such as ecp384r1, secp256r1, or secp512r1.
        For algorithms with variable key lengths, the length is included in the name (e.g., rsa3072).
      examples:
       - rsa2048
       - secp384r1

    certificateType:
      type: string
      description: The type of certificate.
      enum:
        - ca
        - old_ca
        - cross_ca
        - client

    certificateDetails:
      type: object
      required:
        - serial
        - common_name
        - algorithm
        - not_before
        - not_after
      properties:
        serial:
          $ref: '#/components/schemas/certificateSerial'
        common_name:
          $ref: '#/components/schemas/certificateCommonName'
        algorithm:
          $ref: '#/components/schemas/certificateAlgorithm'
        not_before:
          type: string
          format: date-time
          examples:
            - 2020-03-27
          description: Earliest time the certificate is valid
        not_after:
          type: string
          format: date-time
          examples:
            - 2030-03-26
          description: Latest time the certificate is valid
        self_signed:
          type: boolean
          description: Whether this certificate is self-signed. Typically
            only root CA certificates are self-signed.
        signing_ca:
          type: string
          description: The certificate authority that has signed this certificate.
            For self-signed certificate authorities this value is absent.

            This attribute is only present for certificates that are
            managed by the internal PKI of Access Server and the APIs
            that deal and return information about these.

            This is also represented as a string rather than integer
            to avoid problems with JavaScript numbers always being
            double.
          examples:
            - '123'
          format: int64
        signing_ca_cn:
          type: string
          description: The common name of certificate authority that has signed this certificate.
            For self-signed certificate authorities this value is absent.

            This attribute is only present for certificates that are
            managed by the internal PKI of Access Server and the APIs
            that deal and return information about these.
          examples:
            - 'RootCA'



    certificateInformationDetails:
      description: Provides more information about a certificate.
      allOf:
        - $ref: '#/components/schemas/certificateDetails'
        - type: object
          properties:
            sha256fp:
              $ref: '#/components/schemas/certificateFingerprint'
            subj_alt_names:
              description: provides a list of the subjectAlternative attributes of the
                certificate
              type: array
              items:
                type: string
              examples:
                - [ "DNS:foo.example.com", "DNS:www.openvpn.net", "IP:1.2.3.4" ]
            subject:
              type: array
              description: the full subject of the certificate and not only the CN
              examples:
                - [ "C=US", "ST=Maryland", "L=Pasadena", "O=DevOrg", "OU=FreeSoft", "OU=non-free soft",
                         "CN=rogue software department" ]
              items:
                type: string
            issuer:
              type: array
              description: the full subject of the issuer. Note that this field cannot be trusted without
                verifying the signature on the certificate itself. Using this field should come with
                extreme care.
              examples:
                - [ "C=US", "ST=Maryland", "L=Pasadena", "O=DevOrg", "OU=FreeSoft", "OU=non-free soft",
                    "CN=rogue software CA department" ]
              items:
                type: string
            ca:
              type: boolean
              description: Whether the certificate represents a certificate authority
            self_signed:
              description: the signature of the certificate is valid against its own public key
              type: boolean

    certificateAuthorityDetails:
      allOf:
        - $ref: '#/components/schemas/certificateDetails'
        - type: object
          required:
            - cert_type
            - client_profiles
          properties:
            cert_type:
              $ref: '#/components/schemas/certificateType'
            client_profiles:
              type: integer
              description: the number of VPN client profiles are issued by this CA.

    certificateCreateRequest:
      description: Request body to create a certificate. If a CA and its key are provided,
        the certificate is signed by the CA; otherwise, it is self-signed.
      allOf:
        - $ref: '#/components/schemas/certificateRequest'
        - type: object
          required:
            - cert_template
          properties:
            cert_template:
              description: the template to use when creating the certificate.
                This mainly controls the key usage (KU) and extend key usage (EKU) attributes of the certificate
              type: string
              enum:
                - spcert
                - ca
                - intermediate_ca
                - webserver
                - server
                - client
                - hybrid
            days_to_expiry:
              type: integer
              description: number of days while certificate is considered valid
              examples:
                - 365
                - 721
            private_key_passphrase:
              type: string
              description: passhprase for the certificate's private key
            signing_ca:
              $ref: '#/components/schemas/pemEncodedCertificate'
            subj_alt_dns_names:
              description: a list of DNS names that should be added
                as SubjectAlternativeName DNSJake in the certificate
                if the cert_template is webserver.
              type: array
              items:
                type: string
              examples:
                - ["vpn-server.example.com"]
                - ["vpn.example.com", "vpnweb.example.com"]
                - ["vpn.openvpn.com", "vpn.openvpn.in"]
            signing_ca_key:
              $ref: '#/components/schemas/pemEncodedPrivateKey'
            signing_ca_config_key:
              description: the name of a configuration key (e.g. cs.priv.key)
                that will be used to check the certificate validity
            signing_ca_private_key_passphrase:
              type: string
              description: passhprase for signing CA's private key

    certificateRequest:
      type: object
      properties:
        algorithm:
          $ref: '#/components/schemas/certificateAlgorithm'
        common_name:
          $ref: '#/components/schemas/certificateCommonName'
      examples:
        - { 'algorithm': 'secp384r1', 'common_name': 'my shiny new CA' }


    integerConfigurationLimits:
      type: object
      properties:
        default_value:
          description: The default value for the configuration.
          type: integer
        max_value:
          type: integer
          description: A hint of maximum allowed value
        min_value:
          type: integer
          description: A hint for minimum allowed value

    integerConfigurationValue:
      description: A server configuration setting expressed as an integer.
      type: object
      allOf:
        - type: object
          properties:
            value:
              type: integer
        - $ref: '#/components/schemas/integerConfigurationLimits'

    invalidIntegerConfigurationValue:
      description: A configuration value that is expressed as an integer.
      type: object
      allOf:
        - $ref: '#/components/schemas/integerConfigurationLimits'
        - type: object
          properties:
            value:
              type: string
            invalid_value:
              type: boolean
              description: This is set to True to indicate that the value is invalid
                as integer. This happens if the value in the configuration database
                itself has an invalid value. The field value will in this case be a string.

    stringConfigurationValue:
      description: A server configuration setting expressed as a string. Only one of `value` or `redacted_value` will be present.
      type: object
      properties:
        value:
          type: string
          description: the value of this string configuration
        redacted_value:
          type: string
          description: the real value of this configuration key is not present because it is a
            private key or password. The value of this string will give an indication of the
            redacted value.
          examples:
            - PEM encoded private key [rsa2048]
        default_value:
          description: The default value for the configuration.
          type: string
        allowed_values:
          description: if present this array has a list of the allowed values
          type: array
          items:
            type: string
        type_hint:
          type: string
          description: if present, this type hint denotes this configuration value to
            contain a special type of value, so the UI can do additional verification
            to ensure the user input matches this type
          enum:
            - ipv4Address
            - ipv6Address
            - ipAddress
            - hostname
            - pemCertificate
            - pemPrivateKey

    booleanConfigurationValue:
      type: object
      properties:
        value:
          type: boolean
        default_value:
          description: The default value for the configuration.
          type: boolean

    customConfigurationValue:
      description: A configuration key unknown to the backend, possible user-defined or carried over from a new version during downgrade.
      type: object
      properties:
        value:
          type: string


    configurationValueSource:
      description: Indicates the source from which the current value was derived, such as default or user-set.
      type: string
      enum:
        - default
        - local_db
        - cluster_db
        - mysql_standalone_db
        - as_conf
        - environment
        - runtime
        - other

    configurationItemKey:
      type: string
      description: The configuration value\'s key.
      examples:
        - vpn.server.cipher

    configurationItem:
      description: Represents a single configuration item. Check the derived_from field to see whether it's user-set, default, or inherited.
      allOf:
        - type: object
          required:
            - name
            - derived_from
            - category
          properties:
            name:
              $ref: '#/components/schemas/configurationItemKey'
            derived_from:
              $ref: '#/components/schemas/configurationValueSource'
            type:
              type: string
              description: Determines the value type of this configuration item. This
                also implies which of the different value attributes are expected to be
                present on this configuration item.
              enum:
                - custom
                - integer
                - boolean
                - string
            description:
              description: A user readable description of the configuration item that gives a user
                an understandable. This item can be absent for custom configuration values.
              type: string
            category:
              type: string
              description: Different items have different visibility/category that should be taken into
                account when presenting them to the user. This key informs the UI if a variable is
                deprecated but still evaluated (deprecated), deprecated and removed (removed), normal,
                advanced (a value that for normal operation of OpenVPN Access Server should need to be
                changed as it is typically reserved for some corner-case or speciality configurations) or
                is a calculated value that is readonly as it is calculated from other configuration items
                but is not modifiable by the user (derived). Items that have a type of required often do
                not have a default value but must be set in order for Access to correctly work
                (e.g. host.name).

                Removed values should be only shown by the UI if the are set by the user.
              enum:
                - deprecated
                - removed
                - normal
                - required
                - derived
                - advanced
                - custom

        - oneOf:
            - $ref: '#/components/schemas/integerConfigurationValue'
            - $ref: '#/components/schemas/invalidIntegerConfigurationValue'
            - $ref: '#/components/schemas/booleanConfigurationValue'
            - $ref: '#/components/schemas/stringConfigurationValue'
            - $ref: '#/components/schemas/customConfigurationValue'

    pemEncodedCertificate:
      description: A certificate in PEM format, beginning with `-----BEGIN CERTIFICATE----`, followed by base64-encoded content and ending with` -----END CERTIFICATE-----`.
      type: string
      format: pem

    pemEncodedPrivateKey:
      description: A private key in PEM format. This representation typically begins with `-----BEGIN PRIVATE KEY-----`, contains base64-encoded data, and ends with `-----END PRIVATE KEY-----`.

      type: string
      format: pem

    certificateFingerprint:
      description: The SHA256 hash of the certificate body, commonly refferred to as the fingerprint of the certificate.
      type: string
      format: sha256
      examples:
        - 36:D7:D5:1F:47:4A:84:A2:A3:0A:41:BC:92:CB:A5:D9:D6:5F:75:64:84:01:1D:6F:58:B9:D6:67:F8:DB:BE:9C

    apiEndpoint:
      description:
        The API endpoint used to communicate with a specific node. Must be in the format https://ip-or-hostname:port. The https scheme is required because the certificateFingerprint is used by the HTTPS client to verify the identity of the node.

      type: string
      pattern: '^https:\/\/[a-zA-Z0-9\.\-]+:[0-9]+$'
      examples:
        - https://node1:945

    restartMode:
      description: |
        The restart mode requested for Access Server:

          - warm: restarts only internal services that require restarting
          - cold: fully restarts Access Server
          - systemctl: instructs Access Server to restart itself using systemd/systemctl.
          - server_agent: instruct OpenVPN Access Server to initiate a full reinit of the server agent, including re-reading the configuration in as.conf.

        If rereading the configuration from a new DB URI (e.g. after converting the DB or creating a cluster) the mode 'cold' should
        generally be sufficient, as it will revalidate the individual services\' need to reinit, based on the information
        in the DB being used at that moment.

      type: string
      enum:
        - cold
        - warm
        - dry_run
        - systemctl
        - server_agent

    connectedVPNClient:
      description: Represents a connected VPN client, including the current session and connection details.
      allOf:
        - $ref: "#/components/schemas/vpnConnectionID"
        - type: object
          properties:
            bytes_sent:
              type: integer
              description: number of bytes sent
            bytes_received:
              type: integer
              description: number of bytes received
            commonname:
              description: the common name the client uses in its certificate.
              type: string
              examples:
                - "plato_AUTOLOGIN"
            username:
              description: username of the client
              type: string
              examples:
                - "plato"
            connected_since:
              type: string
              format: date-time
              description: time in UTC since when the client is connected.
            datachannel_cipher:
              description: the data channel cipher that is used with this client.
              type: string
              examples:
                - "ChaCha20-Poly1305"
            real_address:
              description: the IP address the client is connected from
              type: string
              examples:
                - "1.2.7.8:23123"
            virtual_ipv4_address:
              description: the virtual or VPN address of the client
              type: string
              examples:
                - 10.0.0.7
            virtual_ipv6_address:
              type: string
              examples:
                - "fd00:f00f::b00f"

    clientID:
      description: The client ID of the connected client. This ID is only unique for a specific daemonID.
        In other words, only the combination of daemonID and clientID uniquely identifies a client.
      type: integer
      examples:
        - 7

    daemonID:
      type: string
      description: An ID that identifies the specific OpenVPN daemon the client is connected to.
      examples:
        - "openvpn_7"

    vpnDaemonStatus:
      type: object
      description: The current status of a VPN daemon.
      properties:
        dco:
          type: boolean
          description: if DCO is used on this daemon instance
        version:
          description: the OpenVPN 2.x version of the daemon
          type: string
          examples:
          - "OpenVPN 2.7_git [git:bloom/520bc001b093857c+] x86_64-pc-linux-gnu [SSL (OpenSSL)] [LZ4] [EPOLL] [MH/PKTINFO] [AEAD] [DCO] built on Nov 30 2023"

    dcoModuleStatus:
      type: object
      required:
        - available
        - version
      properties:
        available:
          description: whether AS detected an installed and working data channel offloading kernel module
          type: boolean
        version:
          type: string
          description: version of the module if available
          examples:
            - "0.2.20230323"

    logDBRecord:
      type: object
      required:
        - timestamp
        - node

      properties:
        timestamp:
          description: record modification timestamp
          type: string
          format: date-time
        node:
          description: AS node that created the log report
          examples:
            - vpn-12.example.com
        username:
          description: username that created the entry
        start_time:
          description: start time of the event or just time of the event if duration is missing
          format: date-time
        duration:
          type: [integer, "null"]
          description: duration of the event in seconds
        service:
          description: the service of OpenVPN Access Server that created the event
          examples:
            - "WEB_ADMIN"
          type: string
        active:
          description: if the session is still active
          type: boolean
        auth:
          description: whether authentication succeeded or not
          type: boolean
        platform:
          description: the platform of the client.
          examples:
            - "android"
        version:
          description: the version of the OpenVPN component that implement the OpenVPN protocol
          examples:
            - "2.6.11"
        protocol:
          type: string
          description: the protocol being used
          examples:
            - "tcp"
            - "udp"
        gui_version:
          description: the IV_GUI version the client reported.
          examples:
            - "de.blinkt.openvpn_0.7.48"
        real_address:
          description: the IP address the client is connected from
          type: string
          examples:
            - "1.2.7.8:23123"
        server_port:
          description: the server side port the client connects/connected to
          examples:
            -  1194
          type: integer
        virtual_ipv4_address:
          description: the virtual or VPN address of the client
          type: string
          examples:
            -  10.0.0.7
        virtual_ipv6_address:
          type: string
          examples:
            -  "fd00:f00f::b00f"
        session_id:
          description: internal session ID of the connection (this might be truncated)
          type: string
          examples:
            -  gOB8vpI1MEr0vBnm
        api_method:
          description: description of the API method that was called
          examples:
            -  ConfigQuery
          type: string
        bytes_sent:
          type: integer
          description: number of bytes sent
        bytes_received:
          type: integer
          description: number of bytes received
        total_bytes:
          type: integer
          description: total number of transferred bytes. (This seems and probably is redundant but currently we keep
            this as individual record in the backend database)
        error:
          type: string
          description: error message on auth failure
          examples:
            -  "LOCKOUT: user temporarily locked out due to multiple authentication failures"
        extra:
          type: string
          description: service-specific data

    licenseInfo:
      description: Contains general fields shared across licensing models, as well as additional fields specific to the current 'licensing_type' in use.
      allOf:
        - type: object
          properties:
            licensing_type:
              description: the method that Access Server is licensed
              type: string
              enum:
                - unlicensed
                - subscription
                - awstiered
                - fixed
            current_cc:
              description: the number of current concurrent connections
              examples:
                - 3
                - 7
              type: integer

            max_cc:
              examples:
                -  13
              type: integer
              description: the maximum amount of connections that this license allows to use. For license types
                are single node (aws, fixed, unlicensed) this is also the limit for all connections. For shared
                licenses (subscription) this denotes the total number of connections in the subscription and the
                current number of allocated connection for an Access Server is denoted in cc_limit.

        - oneOf:
            - $ref: '#/components/schemas/fixedLicenseInfo'
            - $ref: '#/components/schemas/subscriptionInfo'
            - $ref: '#/components/schemas/unlicensedInfo'
            - $ref: '#/components/schemas/awsTieredLicenseInfo'

    unlicensedInfo:
      description: Placeholder information returned when Access Server is not currently licensed.
      type: object

    fixedLicenseInfo:
      description: Describes the current licensing details for Access Server.
        Multiple fixed licenses can be assigned, and the total number of allowed connections
        is the sum of all valid (non-expired)licenses.
      type: object
      properties:
        fixed_licenses:
          type: array
          items:
            type: object
            properties:
              expiry:
                type: string
                format: date-time
                description: expiry date of the license.
              key:
                type: string
                description: the key of the fixed license
              max_cc:
                type: integer
                description: maximum amount of connection for this fixed license.

    awsTieredLicenseInfo:
      type: object
      properties:
        region:
          type: string
          description: the AWS region
          examples:
            - 'eu-central-1'
        product_code:
          type: string
          description: the AWS product code that identifies this license
          examples:
            -  '3ihdqli79gl9v2jnlzs6nq60h'
        instance_id:
          type: string
          description: the AWS instance ID
          examples:
            -  'i-0c1ac1ca2f4b4a23b'


    subscriptionInfo:
      type: object
      properties:
        agent_id':
          type: string
          examples:
            -  "13014502862141447248"
          description: the identifier the client uses to connect to STS

        agent_disabled:
          type: boolean

        cc_limit:
          type: integer
          description: the limit of connection assigned to the Access Server. This can dynamically change.
          examples:
            -  13

        error:
          type:
            - string
            - 'null'
          description: if an error occurred this will be set to a human-readable error message

        fallback_cc':
          type: integer
          examples:
            -  2
          description: the amount of connection that the subscription will revert to if the subscription
            server cannot be reached for an extended time (grace_period)

        grace_period:
          examples:
            -  30
          type: integer
          description: number of days after which the subscription will revert to fallback_cc amount of connections

        last_successful_update:
          type: string
          format: date-time
          description: the last time the subscription was successfully updated

        total_cc:
          type: integer
          description: the total number of current connections for the subscription over all Access Server that
            use this subscription. Basically the current_cc of all OpenVPN Access Server using this subscription
            summed up.
        name:
          type: string
          examples:
            -  'Test subscription for development'
          description: A name given to the subscription.

        subkey:
          type: string
          examples:
            -  "ASUYHgkSWvVQFZhJXVdgtEa_AStctYuHirYZeFbZjLvQCWCaViVamXwL_7a289be35f6987c9aec4585c922a740c1b7620d5"
          description: "The subkey that uniquely identifies the subscription on the backend."

        billing_id:
          type: string
          examples:
            - tctYuHirYZeFbZjLvQC
          description: An opaque identifier that allows identifying the subscription on the billing portal.

        next_update:
          type: string
          format: date-time
          description: when the next update to the subscription server is scheduled

        updates_failed:
          type: integer
          examples:
            -  0
          description: the number of updates that failed since the last successful update.

        notes:
          type: array
          description: both server generated and locally generated additional notes to display to the user
          examples:
            -  [ "Subscription will expire on 1/2/3",  "Maximum allowed concurrent connections might be limited to 23 by the 'subscription.local_cc_limit' setting" ]
          items:
            type: string

        overdraft:
          type: boolean
          description: Subscription is currently in overdraft mode

        server:
          type: string
          examples:
            -  'asb.sts.openvpn.net'
          description: the server that is used to for subscription tracking

        'type':
          description: Type of the subscription as reported by the STS server
          type: string
          examples:
            -  '-'

        state:
          type: string
          enum:
            - SUBSCRIPTION_OK
            - SUBSCRIPTION_EXPIRED
            - NOT_CONFIGURED
            - AGENT_DISABLED
            - SUBSCRIPTION_INVALID
            - SUBSCRIPTION_ENDED
            - SUBSCRIPTION_PAUSED
            - STSTRACK_ERROR
            - REQUEST_ERROR
          description: the current state of the subscription agent

    profileToken:
      type: object
      description: A token (typically one-time use) that can be used to retrieve a connection profile from Access Server.
        Access Server
      properties:
        token:
          type: string
          description: the unique string that identifies the token
          examples:
            -  "a4aL62OFooAjPu4wu6MQCvcmY070hu8B"
        username:
          type: string
          description: the username this token will generate the profile for
          examples:
            -  arne@openvpn.net
        expires:
          type: string
          format: date-time
          description: the token is only valid until this time
        profile_type:
          $ref: '#/components/schemas/profileType'
        usages:
          description: how often this token can be used to retrieve a profile
          type: integer
          examples:
            -  1

    userPropUser:
      allOf:
        - $ref: '#/components/schemas/userProp'
        - $ref: '#/components/schemas/userLevelOnlyProps'
        - $ref: '#/components/schemas/userPropScripts'

    userPropUserSet:
      allOf:
        - $ref: '#/components/schemas/userPropSet'
        - $ref: '#/components/schemas/userLevelOnlyProps'
        - $ref: '#/components/schemas/userPropScriptsSet'

    userPropGroup:
      allOf:
        - $ref: '#/components/schemas/userProp'
        - $ref: '#/components/schemas/groupLevelOnlyProps'
        - $ref: '#/components/schemas/userPropScripts'

    userPropGroupSet:
      allOf:
        - $ref: '#/components/schemas/userPropSet'
        - $ref: '#/components/schemas/groupLevelOnlyProps'
        - $ref: '#/components/schemas/userPropScriptsSet'

    userPropUserDefault:
      allOf:
        - $ref: '#/components/schemas/userProp'
        - $ref: '#/components/schemas/defaultUserOnlyProps'
        - $ref: '#/components/schemas/userPropScripts'
        - type: object
          properties:
            group:
              type: string
              description: the group a user belongs too (conn_group)
              examples:
                -  "stringsection"

    userPropUserDefaultSet:
      allOf:
        - $ref: '#/components/schemas/userPropSet'
        - $ref: '#/components/schemas/defaultUserOnlyProps'
        - $ref: '#/components/schemas/userPropScripts'
        - type: object
          properties:
            group:
              type: string
              description: the group a user belongs too (conn_group)
              examples:
                -  "stringsection"


    defaultUserOnlyProps:
      description: Describes properties that are available for groups but not applicable to individual users.
      type: object
      properties:
        def_deny:
          type: boolean
          description: If this is set to true user accounts will not be created if they are not listed in userprop.
            Normally, if an external auth is used (e.g. LDAP), then a user will automatically create if the external
            authentication system indicates a successful login.

    groupLevelOnlyProps:
      description: Describes userprop properties that apply only at the group level and aren't available for individual user configurations.
      type: object
      properties:
        members:
          type: array
          description: list of all users that are members of this group. This property will be only be present
            if members of the group are enumerate_memberate is true in the groupRequestParameters
          examples:
            -  [ "niccolo@paganini.it", "hillary@hahn.us", "yoyoma" ]
          items:
            type: string
        member_count:
          type: integer
          description: the number of users that belong to this group.
        subnets:
          description: The subnets assigned to this group. This list will be a mixed
            list of IPv4 and IPv6 subnets. The backend userprops are group_subnets
            and group_subnets6
          type: array
          items:
            $ref: '#/components/schemas/IPsubNet'
        dynamic_ranges:
          description: >
            The dynamic ranges assigned to this group.
            This list will contain both IPv4 and IPv6 ranges.

            The backend userprops for this property are group_range and group_range6.
          type: array
          items:
            $ref: '#/components/schemas/groupIpRange'


    userLevelOnlyProps:
      description: Describes userprop properties that are exclusive to individual users and cannot
        be inherited from group or global levels.
      type: object
      properties:
        password_defined:
          type: boolean
          description: This indicates whether the user has a password set. The API will NOT
            provide the hash of the password but only the information if a user password has
            been set.
        mfa_status:
          type: string
          description: the status of the multi factor authentication. This is a read-only
            property that combines totp and totp_locked into a single status.
          enum:
            - pending
            - disabled
            - enrolled

        totp_locked:
          type: boolean
          description: specifies if the TOTP for the user is locked/enrolled.  If true, secret is no longer viewable

        group:
          type: string
          description: the group a user belongs too (conn_group)
          examples:
            -  "stringsection"

        static_ipv4:
          description: optional property. Maps to conn_ip
          type: string

        static_ipv6:
          description: optional property. Maps to conn_ip6
          type: string

        dmz_ip:
          description: The IP addresses and port-ranges that are exposed on this client.
          type: array
          items:
            $ref: '#/components/schemas/DMZIP'

        dmz_ipv6:
          description: The IPv6 addresses and port-ranges that are exposed on this client.
          type: array
          items:
            $ref: '#/components/schemas/DMZIP'

        compile:
          type: boolean
          description: If true the type is 'user_compile' instead of 'user_connect'.

        totp_secret:
          type: string
          description: the TOTP secret code according to RFC 6238. Note, that this is value might not be present for locked users in later versions (pvt_google_auth_secret).

        totp_admin_only:
          type: boolean
          description: totp_admin_only only AS admins can generate and view Google Authenticator secrets (prop_google_auth_admin_locked)

        client_to_server_subnets:
          type: array
          description: <
            Subnets that are behind the client. I.e. the client will be a
            router/gateway for the subnets specified in this array.

            On the server side, this is split into ipv4 and ipv6 subnets
            (c2s_subnets and c2s_subnets6) but this API represents that as
            a single list. Use the ipv6 flag of the subnet to determine the
            address family.
          items:
            $ref: '#/components/schemas/IPsubNet'


    userPropValue:
      description: This object describes a single user property value. If the value is inherited, the response includes metadata about the inheritance source.
      type: [object, "null"]
      required:
        - value
      properties:
        value:
          description: the value that this property has. If inherited is false, this is
            identical to inheritedValue
          oneOf:
            - type: string
            - type: boolean
        inherited:
          type: boolean
          description: specifies if this value is inherited from an upper level
            if this
        inherited_source_type:
          type: string
          description:
            describes where the inherited values comes. This can be from the default user
            properties (__default__) or from a global configuration settings or from a group

            If the property is explicitly set (ie inherited is false), this property indicates what the
            property would inherit from if inherit is false.
          enum:
            - default
            - implicit_default
            - group
            - configuration
        inherited_source_name:
          description:
            for the inherited types where knowing the name of the source can be beneficial. Like
            the group name or in some cases the configuration key.

            If the property is explicitly set (ie inherited is false), this property indicates what the
            property would inherit from if inherit is false.
          type: string
          examples:
            -  administrators

    userProp:
      type: object
      description: |
        This hold the attributes of the userprop that is not specifically handled in a special
        way like passwords or group members. OpenAPI does not allow to specify description along with $ref
        so the description for the individual keys is in this descriptions. \n

        - deny (boolean): If true cannot connect or login (prop_deny)
        - deny_web (boolean): If true cannot login to web (prop_deny_web)
        - admin (boolean): user is admin (prop_superuser)
        - autologin (boolean): autologin profile generation is allowed by the user themselves (prop_autologin)
        - auth_method (string): the authentication method that will be used for the user. Maps to user_auth_type
          and default configuration etc.
        - cc_commands: custom OpenVPN directives that will imported for the user on the server side (prop_cc_cmds)
        - totp: specifies whether TOTP based MFA is required (prop_google_auth)
        - password_strength: password strength check is enforced when changing the password for local auth
          (prop_pwd_strength/cs.cws.pwd_strength)
        - allow_password_change (boolean): specifies if a user is allowed to change the password themselves
          when local auth is used (prop_pwd_change). If not set on users the global default server key
          cs.cws.pwd_change is used as default. Admins can always change user passwords (including their own).
        - reroute_gw (string): one of 'disable', 'dns_only', 'global'	Disables redirection of the
          default route and/or DNS on the client. This does not block it on the backend, if blocking on the backend
          is required, access lists should be added in addition. Defaults to 'global' if not set. The setting global
          will follow the configuration key 'vpn.client.routing.reroute_gw'.(prop_reroute_gw_override)
        - allow_generate_profiles (prop_autogenerate): allow users themselves to generate connection profiles
      properties:
        name:
          type: string
          description: the name of the user or group.
        deny:
          $ref: '#/components/schemas/userPropValue'
        deny_web:
          $ref: '#/components/schemas/userPropValue'
        admin:
          $ref: '#/components/schemas/userPropValue'
        autologin:
          $ref: '#/components/schemas/userPropValue'
        auth_method:
          $ref: '#/components/schemas/userPropValue'
        cc_commands:
          $ref: '#/components/schemas/userPropValue'
        totp:
          $ref: '#/components/schemas/userPropValue'
        password_strength:
          $ref: '#/components/schemas/userPropValue'
        allow_password_change:
          $ref: '#/components/schemas/userPropValue'
        reroute_gw:
          $ref: '#/components/schemas/userPropValue'
        allow_generate_profiles:
          $ref: '#/components/schemas/userPropValue'
        bypass_subnets:
          type: array
          description: Subnets or hosts (represented subnet with a /32 or /128 netmask) that are installed
            as bypass routes on the client, i.e. that will bypass the VPN and use the normal non-VPN
            connection.
          items:
            $ref: '#/components/schemas/IPsubNet'

    userPropSet:
      type: object
      description: |
        The same as userProp schema. With the difference that it used solely for setting user properties. This means that all fields here is set directly, instead of wraping them in userPropValue object.
      properties:
        name:
          type: string
          description: the name of the user or group.
        deny:
          type: boolean
        deny_web:
          type: boolean
        admin:
          type: boolean
        autologin:
          type: boolean
        auth_method:
          type: string
        cc_commands:
          type: string
        totp:
          type: boolean
        password_strength:
          type: boolean
        allow_password_change:
          type: boolean
        reroute_gw:
          type: boolean
        allow_generate_profiles:
          type: boolean
        bypass_subnets:
          type: array
          description: Subnets or hosts (represented subnet with a /32 or /128 netmask) that are installed
            as bypass routes on the client, i.e. that will bypass the VPN and use the normal non-VPN
            connection.
          items:
            $ref: '#/components/schemas/IPsubNet'

    userPropScripts:
      type: object
      description: |
        This hold the attributes of the userprop that control client side scripting. It is not handled in a special  way like passwords or group members. OpenAPI does not allow to specify description    along with $ref so the description for the individual keys is in this descriptions.

          - Client side scripting: prop_cli.script.<win|mac|all>.<user|admin>.<connect|disconnect>
          - Client script env:  prop_cli.script_env.win|prop_cli.script_env.mac"

          example environment variable:     "prop_cli.script_env.win.MSI_URL": "https://secure.openvpn.net/tmp/bogi.msi",

      properties:
        cli_script_connect_win_user_connect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_win_user_disconnect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_win_admin_connect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_win_admin_disconnect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_mac_user_connect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_mac_user_disconnect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_mac_admin_connect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_mac_admin_disconnect:
          $ref: '#/components/schemas/userPropValue'
        cli_script_connect_win_env:
          description: environment variables for the Windows script to run, each key will specify the name of the
            environment variable.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/userPropValue'
          examples:
            - { 'MSI_URL': "https://secure.openvpn.net/tmp/bogi.msi", "lucky_number": "23", "SCRIPT_VER": "alpha9" }
        cli_script_connect_mac_env:
          description: environment variables for the macOS script to run, each key will specify the name of the
            environment variable.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/userPropValue'

    userPropScriptsSet:
      type: object
      description: |
        The same as userPropScripts schema. With the diffirence that it is used solely for setting user properties. This means that all fields here is set directly, instead of wraping them in userPropValue object.

      properties:
        cli_script_connect_win_user_connect:
          type: string
        cli_script_connect_win_user_disconnect:
          type: string
        cli_script_connect_win_admin_connect:
          type: string
        cli_script_connect_win_admin_disconnect:
          type: string
        cli_script_connect_mac_user_connect:
          type: string
        cli_script_connect_mac_user_disconnect:
          type: string
        cli_script_connect_mac_admin_connect:
          type: string
        cli_script_connect_mac_admin_disconnect:
          type: string
        cli_script_connect_win_env:
          description: environment variables for the Windows script to run, each key will specify the name of the
            environment variable.
          type: object
          additionalProperties:
            type: string
          examples:
            - { 'MSI_URL': "https://secure.openvpn.net/tmp/bogi.msi", "lucky_number": "23", "SCRIPT_VER": "alpha9" }
        cli_script_connect_mac_env:
          description: environment variables for the macOS script to run, each key will specify the name of the
            environment variable.
          type: object
          additionalProperties:
            type: string

    serviceStatusEnum:
      type: string
      enum:
        - on
        - disabled
        - error
        - enabled

    serviceWarning:
      type: object
      properties:
        tag:
          type: string
          description: A tag assigned to the type of warning/error message
          examples:
            - DCO_NOT_ACTIVE
            - SERVICE_UNRESOLVED_DEPENDENCIES
        message:
          type: string
          examples:
            - "Insecure VPN cipher in use"
          description: A short summary of the warning in question
        description:
          description: A longer more detailed description of the warning
          examples:
            - "Insecure cipher DES-EDE3-CBC allowed for VPN encryption. Consider removing this cipher from vpn.server.data_ciphers (AES-256-GCM:DES-EDE3-CBC) and/or disabling vpn.server.enable_cipher_fallback (False)"
        severity:
          type: string
          enum:
            - ok
            - info
            - warning
            - critical
            - error
          description: The level of the warning. The level error signals a hard error that prevents
            Access Server from starting and ok signal


    serviceStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/serviceStatusEnum'
        error:
          description: a list of important error message/warnings that impact current operation
          type: array
          items:
            $ref: '#/components/schemas/serviceWarning'

    serverStatus:
      type: object
      description: Provides the current status of the internal services running on the server.
      properties:
        last_restarted:
          description: the last time the server was restarted
          type: string
          format: date-time

        service_status:
          description: an object containing the status of the various internal services. The
            key name holds the name of the service.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/serviceStatus'

        auth_module_status:
          description: an object containing the status of the various authentication services. The
            key name holds the name of the service.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/serviceStatusEnum'

    serverInterface:
      type: object
      description: Describes a Linux network interface along with its associated primary networks.
      properties:
        name:
          description: the name identifying the interface
          examples:
            -  "eth0"
        networks:
          description: IP addresses assigned to the interface
          type: array
          items:
            $ref: '#/components/schemas/IPsubNet'

      examples:
        -  { "name" : "eth0", "networks": [ {"netip": "fd00::18cc:1b01:a772:50e1", "ipv6": true, prefix_len: "64"}, {"netip": "10.0.0.1", "ipv6": false, "prefix_len": 25}, {"netip": "192.168.0.1", "ipv6": false, "prefix_len": 24}]}


    serverConfig:
      type: object
      description: Describes global configuration settings for Access Server that are accessible to any authenticated user.
      required:
        - control_channel_security
        - installers
        - password_min_len
        - disable_open_in_app
        - admin_port
        - shared_origin
      properties:
        control_channel_security:
          $ref: '#/components/schemas/controlChannelSecurity'
        installers:
          # Installers vs options of client profiles to offer
          type: array
          items:
            $ref: '#/components/schemas/installerType'
        hide_profiles_page:
          type: boolean
          description: If True, the Connections profile page is hidden
        password_min_len:
          type: integer
          description: Minimal length for the password if strength check is enabled.
        disable_open_in_app:
          type: boolean
          description: If True then disable in app on UI
        admin_port:
          type: integer
          description: port for Admin site
        shared_origin:
          type: boolean
          description: CWS and Admin ui are both available on same origin (protocol + hostname + port) as this API endpoint being called.

    controlChannelSecurity:
      type: string
      enum:
        - none
        - tls-auth
        - tls-crypt
        - tls-crypt-v2

    serverInfo:
      type: object
      properties:
        version:
          description: the version number of Access Server
          type: string
          examples:
            -  "2.13.0-internal"
        build:
          type: string
          description: the build of Access Server.
          examples:
            -  18eba991
        web_version:
          description: the build version number of Access Server UI
          type: string
          examples:
            - 2.12.7-82fda2
        web_override:
          description: if true the version of the web ui that is used comes
            from an override-web.zip instead of the bundled version
          type: boolean
        client_version:
          description: version of the embedded client package. `null` if the user manually deleted the files of the
             openvpn-as-bundled-clients package
          type: [string, "null"]
          examples:
            - "27"
        os_distribution:
          type: string
          description: a human readable identifier of the current (Linux) distribution like
            PRETTY_NAME from /etc/os-release
          examples:
            -  "Ubuntu 24.04.6 LTS"
        architecture:
          description: the CPU architecture
          type: string
          enum:
            - arm64
            - amd64
        cores:
          description: the number of cores available to OpenVPN Access server. Typically identical to system_cores.
          type: integer
        system_cores:
          description: the number of cores visible to the operating system
        os_hostname:
          description: Operating system's hostname
          type: string
          examples:
            - access-server-os-hostname

    eulaStatus:
      type: object
      properties:
        eula_version_as:
          description: The version of the AS EULA
          type: integer
          examples:
            - 7

        eula_web_hash:
          description: 'A SHA256 string in hex format without : separators'
          type: string
          format: sha256
          examples:
            - '36D7D51F474A84A2A30A41BC92CBA5D9D65F756484011D6F58B9D667F8DBBE9C'

        eula_accepted:
          type: boolean
          description: indicates whether the config setting (aui.eula_version) has the same value as eula_version_as

    notificationMessage:
      type: object
      description: notification msg stored in notificationdb
      required:
        - notification_type
      properties:
        notification_type:
          description: the type of notification
          type: string
          enum:
            - CLUSTER_RESTART_PENDING
            - NODE_RESTARTED
          message:
            description: optional message to add in addition to message type
            type: string
            examples:
              - 'Settings have been changed. All nodes should restart to reload settings'
              - 'Node has restarted'
          to:
            description: indended recepient of the notification message
            type: string
            examples:
              - 'all'
              - 'node1'
          severity:
            description: the severity of the message. Unused currently at backend
            type: string
            examples:
              - '3'

    clusterProps:
      type: object
      description: Properties shared across all nodes in an Access Server cluster.
      properties:
        rr_dns_hostname:
          description: the Round-Robin hostname that uniquely identifies the cluster
          type: string
          examples:
            - 'cluster.example.com'
        rr_dns_new_nodes:
          description: if true, use rr_dns_hostname as node hostname for new nodes joining the cluster
          type: boolean

    clusterNode:
      type: object
      description: Describes a node in the cluster. The certificate field represents the certificate the node presents on its api_endpoint and is used to verify the node\'s identity.
      required:
        - name
      properties:
        name:
          description: the name that uniquely identifies the cluster node [node_name]
          type: string
          examples:
            -  'vienna.example.com'
        api_endpoint:
          $ref: "#/components/schemas/apiEndpoint"
        certificate_fingerprint:
          $ref: "#/components/schemas/certificateFingerprint"

    clusterNodeJoinRequest:
      description: Describes a node requesting to join the cluster. The certificate field represents the
        certificate the node presents on its `api_endpoint` and is used to verify the node's identity.
      allOf:
        - $ref: '#/components/schemas/clusterNode'
        - type: object
          properties:
            mysql_uri_parts:
              $ref: "#/components/schemas/mysqlUriParts"

    clusterNodeCreateRequest:
      description: Defines the properties common to all nodes in the cluster.
      allOf:
        - $ref: '#/components/schemas/clusterNodeJoinRequest'
        - $ref: '#/components/schemas/clusterProps'
        - type: object
          properties:
            rr_update_node:
              description: >
                if true:
                  update host.name in confdb_local to rr_dns_hostname in clusterdb when creating the cluster.
                if false:
                  do not use rr_dns_hostname to update host.name in confdb_local, at cluster creation time.

                This is to provide admin the flexibility to update host.name to rr_dns_hostname at a later stage than cluster creation.
              type: boolean

    mysqlUriParts:
      type: object
      description: a structure describing parts of a MySQL URI. The database name and the query are neither supported
        nor expected by the admin UI's cluster setup pages' logic, so these fields are not included.
      required:
        - host
        - port
        - username
        - password
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
        password:
          type: string

    profileRequest:
      type: object
      required:
        - profile_type
      properties:
        username:
          $ref: "#/components/schemas/username"
        profile_type:
          $ref: '#/components/schemas/profileType'
        tls_crypt_v2:
          description: The client is capable of TLS-Crypt v2
          type: boolean
        comment:
          description: A user-defined comment
          type: string
          examples:
            -  connected from my iPhone
        ignore_missing_user:
          description:
            if this is flag, which requires admin rights, is set, a
            profile will be created even if the specified user does
            not exist.

    installerProfileRequest:
      description: Fields used to request a download URL for a specific installer profile.
      type: object
      required:
        - installer_type
      properties:
        user:
          $ref: "#/components/schemas/username"
        installer_type:
          $ref: '#/components/schemas/installerType'
        profile_type:
          $ref: '#/components/schemas/profileType'
        tls_crypt_v2:
          description: The client is capable of TLS-Crypt v2
          type: boolean


    commonPaginationParameters:
      description: Shared parameters used by endpoints that support pagination.
        The `order_by` and `sort_by` fields depend on the type of object being paginated.
      type: object
      properties:
        page_size:
          type: integer
          description: number of the profiles that are returned
        offset:
          type: integer
          description: offset for pagination
          # TODO:double check that OFFSET in SQL has good performance or have some offset that is dependent
          # on sorting key
        sort_by:
          $ref: "#/components/schemas/sortingDirection"


    profileRequestParameters:
      description: |
        Defines filters and parameters for requesting user profiles.

        Notes: Some search fields may not be indexed in the backend database,
        which can impact performance. Non-admin users can only filter by their
        own username; using another username will result in an error.
      allOf:
        - $ref: '#/components/schemas/commonPaginationParameters'
        - type: object
          properties:
            order_by:
              $ref: "#/components/schemas/certProfileSorting"
            filters:
              properties:
                username:
                  $ref: '#/components/schemas/filterString'
                serial:
                  $ref: '#/components/schemas/filterInteger'
                autologin:
                  $ref: '#/components/schemas/filterBool'
                tls_crypt_v2:
                  $ref: '#/components/schemas/filterBool'
                last_used:
                  $ref: '#/components/schemas/filterTime'
                not_before:
                  $ref: '#/components/schemas/filterTime'
                not_after:
                  $ref: '#/components/schemas/filterTime'
                comment:
                  $ref: '#/components/schemas/filterString'
                signing_ca_cn:
                  $ref: '#/components/schemas/filterString'
                anywhere:
                  $ref: '#/components/schemas/filterAnywhere'

    userRequestParameters:
      description: |
        Specifies filters for requesting user parameters.

        When multiple filters are used, only items matching all filters are returned.
        The 'anywhere' filter is a special case and must be used alone.
      allOf:
        - $ref: '#/components/schemas/commonPaginationParameters'
        - type: object
          properties:
            order_by:
              $ref: "#/components/schemas/userSorting"
            filters:
              allOf:
                - type: object
                  properties:
                    name:
                      $ref: '#/components/schemas/filterString'
                    group:
                      $ref: '#/components/schemas/filterString'
                - $ref: '#/components/schemas/commonUserGroupFilters'
            users:
              type: array
              description: a list of usernames that should be fetched. Note, that this list cannot be arbitrarily long
                as the query to the backend database has a size limit for a query. Note that usernames that are not
                found in the backend will be missing from the response.
              items:
                $ref: '#/components/schemas/username'
            proplist:
                $ref: '#/components/schemas/userPropList'

    commonUserGroupFilters:
      type: object
      description: Filters that apply to both user and group requests.
      properties:
        admin:
          $ref: '#/components/schemas/filterBool'
        autologin:
          $ref: '#/components/schemas/filterBool'
        anywhere:
          $ref: '#/components/schemas/filterAnywhere'


    tokenRequestParameters:
      description: Parameters used to create a new token URL.
        Non-admin users should typically only specify the profile type. Setting other parameters above their
        default values may result in errors.
      type: object
      required: [ profile_type ]
      properties:
        lifetime:
          description: Optional lifetime in seconds that the token should be valid for. Longer lifetimes than default require admin privileges.
          type: integer
          minimum: 1
          maximum: 2147483647 # max valid int for datetime functions and Integer db columns
        usages:
          description: Optional number of usages that this token can be used to generate a profile. Defaults to a single use if not provided. Specifying more than one usage requires admin privileges.
          type: integer
          minimum: 1
          maximum: 2147483647 # max valid int for datetime functions and Integer db columns
        profile_type:
          $ref: '#/components/schemas/profileType'
        username:
          $ref: '#/components/schemas/username'

    logDBRequestParameters:
      description: Filters and parameters for querying the log database.
        Only selected fields from 'logDBRecord' are supported, and some searches
        may be slow due to the lack of database indexing.
      allOf:
        - $ref: '#/components/schemas/commonPaginationParameters'
        - type: object
          properties:
            order_by:
              $ref: "#/components/schemas/logDBSortingFields"
            filters:
              properties:
                start_time:
                  $ref: '#/components/schemas/filterTimeOrDuration'
                timestamp:
                  $ref: '#/components/schemas/filterTimeOrDuration'
                duration:
                  $ref: '#/components/schemas/filterDuration'
                node:
                  $ref: '#/components/schemas/filterString'
                username:
                  $ref: '#/components/schemas/filterString'
                active:
                  $ref: '#/components/schemas/filterBool'
                error:
                  $ref: '#/components/schemas/filterBool'
                service:
                  $ref: '#/components/schemas/filterString'
                virtual_ipv4_address:
                  $ref: '#/components/schemas/filterString'
                bytes_sent:
                  $ref: '#/components/schemas/filterBandwidth'
                bytes_received:
                  $ref: '#/components/schemas/filterBandwidth'
                gui_version:
                  $ref: '#/components/schemas/filterString'
                version:
                  $ref: '#/components/schemas/filterString'
                platform:
                  $ref: '#/components/schemas/filterString'
                protocol:
                  $ref: '#/components/schemas/filterString'
                anywhere:
                  $ref: '#/components/schemas/filterAnywhere'

    filterTimeOrDuration:
      description: |
        Specifies a time range to filter results by a given attribute.

        You can define the range using either absolute timestamps or relative time values.
        If only one endpoint (start or end) is provided, the range is considered open-ended.
        For example, a start of 2020-02-02 and no end point
        means the time interval of [2020-02-02, ∞). The same logic applies relative time inputs.
      type: object
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        start_relative:
          type: string
          pattern: '^\d+[smhdwMy](\s\d+[smhdwMy])*$'
        end_relative:
          type: string
          pattern: '^\d+[smhdwMy](\s\d+[smhdwMy])*$'
      examples:
        - { 'start_relative': '20d', 'end_relative': '15d 20m' }
        - { 'start': '2022-02-22', 'end': '2022-02-23' }

    filterBandwidth:
      description: This specifies that the result should be filtered by this attribute
        with the specified operation.
      type: object
      properties:
        value:
          oneOf:
            - type: string
              pattern: '^\d*(?:\.\d+)?(?:\s*[mkg]?b)?$'
            - type: integer
        operation:
          type: string
          enum:
            - less_than
            - greater_than
      required:
        - value
        - operation
      examples:
        - { 'value': '20kb', 'operation': 'less_than' }
        - { 'value': '1gb', 'operation': 'greater_than' }

    filterString:
      description: Specifies a filter for string-based attributes using a defined operation.
      type: object
      properties:
        value:
          type: string
        operation:
          type: string
          enum:
            - equal
            - substring
            - not_equal
      required:
        - value
        - operation
      examples:
        - { 'operation': 'substring', 'value': 'vio' }

    filterDuration:
      description: Specifies a filter for duration-based attributes using a defined operation.
      type: object
      properties:
        value:
          type: string
        operation:
          type: string
          enum:
            - less_than
            - greater_than
      required:
        - value
        - operation
      examples:
        - { 'value': '20d', 'operation': 'less_than' }

    filterInteger:
      description: Specifies a filter for integer-based attributes using a defined operation.
      type: object
      properties:
        value:
          type: integer
        operation:
          type: string
          enum:
            - equal
            - less_than
            - greater_than
            - not_equal
      required:
        - value
        - operation
      examples:
        - { 'value': 400, 'operation': 'less_than' }

    filterTime:
      description: This specifies that the result should be filtered by this attribute
        with the specified time range. If one of the time points is missing it means
        that the range is  unspecified. E.g. a start of 2020-02-02 and no end point
        means the time interval of [2020-02-02, ∞).
      properties:
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    filterBool:
      description: Specifies a filter for boolean attributes. The operation is always equality (equal) since only true or false values are valid.
      type: object
      required:
        - value
      properties:
        value:
          type: boolean
      examples:
            -  { 'value': true }


    filterAnywhere:
      description: Applies a substring match across multiple fields. Returns results if the specified value matches
        any part of any listed field.
      type: object
      properties:
        value:
          description: the substring to search in all specified fields
          type: string
        fields:
          description: names of the fields to be searched
          type: array
          items:
            type: string
            enum:
              - node
              - username
              - service
              - duration
              - active
              - virtual_ipv4_Address
              - bytes_received
              - bytes_sent
              - timestamp
              - error
              - version
              - gui_version
              - platform

      examples:
            -  { 'value': 'bass', 'fields': [ 'username', 'group' ] }

    accessControlRuleTypeEnum:
      description: Rules can have one of these types.
      type: string
      enum:
        - domain_routing
        - filter

    accessControlRuleMatchTypeEnum:
      description: Rules can have one of these match types.
      type: string
      enum:
        - domain
        - not_domain
        - subdomain
        - not_subdomain
        - domain_or_subdomain
        - not_domain_or_subdomain

    accessControlRuleActionEnum:
      description: Rules can have one of these actions.
      type: string
      enum:
        - route
        - nat
        - deny
        - bypass

    filterAccessRuleType:
      description: Specifies a filter for access control rule types.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/accessControlRuleTypeEnum'
        operation:
          type: string
          enum:
            - equal
            - not_equal
      required:
        - value
        - operation
      examples:
        - { 'value': 'domain_routing', 'operation': 'equal' }

    filterAccessRuleMatchType:
      description: Specifies a filter for access control rule match types.
      type: object
      properties:
        value:
          $ref: '#/components/schemas/accessControlRuleMatchTypeEnum'
        operation:
          type: string
          enum:
            - equal
            - not_equal
      required:
        - value
        - operation
      examples:
        - { 'value': 'domain', 'operation': 'equal' }


    groupRequestParameters:
      description: Specifies filters and pagination parameters for group-related API requests. The order_by and sort_by fields depend on the properties available in the group objects being queried.
      allOf:
        - $ref: '#/components/schemas/commonPaginationParameters'
        - type: object
          properties:
            order_by:
              $ref: "#/components/schemas/groupSorting"
            filters:
              allOf:
                - type: object
                  properties:
                    name:
                      $ref: '#/components/schemas/filterString'
                - $ref: '#/components/schemas/commonUserGroupFilters'
            enumerate_members:
              $ref: '#/components/schemas/enumerateMembersParameter'
            groups:
              type: array
              description: a list of groups that should be fetched. Note, that this list cannot be arbitrarily long
                as the query to the backend database has a size limit for a query. Note that groups that are not
                found in the backend will be missing from the response.
              items:
                $ref: '#/components/schemas/groupname'
            proplist:
                $ref: '#/components/schemas/userPropList'

    accessListRequestParameters:
      description: |
        Parameters used when querying access lists.

        The `name` field refers to either a user or group name.

        Due to the way access control list (ACL) entries are stored as strings in the database, sorting and filtering options are limited.
      type: object
      properties:
        order_by:
          type: string
          enum:
            - internal_prop_representation
            - name
        filters:
          description: filters for the access list objects.
          type: object
          properties:
            internal_representation:
              $ref: '#/components/schemas/filterString'
            groupname:
              $ref: '#/components/schemas/filterString'
            username:
              $ref: '#/components/schemas/filterString'
            object_type:
              description: Only return users or groups in the response.
              type: string
              enum:
              - user
              - group
              - all
        groups:
          type: array
          description: a list of groups that should be fetched. Note, that this list cannot be arbitrarily long
            as the query to the backend database has a size limit for a query. Note that groups that are not
            found in the backend will be missing from the response.
          items:
            $ref: '#/components/schemas/groupname'
        users:
          type: array
          items:
            $ref: '#/components/schemas/username'
          description: a list of usernames that should be fetched. Note, that this list cannot be arbitrarily long
            as the query to the backend database has a size limit for a query. Note that usernames that are not
            found in the backend will be missing from the response.


    enumerateMembersParameter:
      type: boolean
      description: If set to true, the response includes a list of all group members; otherwise, only the member count is returned.

    userPropList:
      description: A list of user properties to retrieve. If set to null,
        all properties for the user or group are returned. Otherwise, only
        the specified properties in the list will be included in the response.
      type:
        - array
        - 'null'
      items:
        type: string

    DMZIP:
      description: A DMZ IP and port that will be forwarded to the client.
        This corresponds to the internal dmz_ip user property, formatted as `IP[:proto/start_port[-end_port]]`.
      type: object
      required:
        - ip
      properties:
        ip:
          type: string
          description: the external IP address of the Access Server
        protocol:
          $ref: '#/components/schemas/layer4protocol'
        start_port:
          type: integer
          description: the starting port for the dmz. If not specified all
            ports will be forwarded
        end_port:
          type: integer
          description: the end port of the ports that are being forwarded. If
            not specified only a single port (the start_port) is forwarded.

      examples:
            -  { 'ip': '123.7.3.1', 'start_port': 7000, 'end_port': 7111, 'protocol': 'udp'}

    IpService:
      description: Describes a network service using an IP protocol — either TCP, UDP, or ICMP.
      oneOf:
        - $ref: '#/components/schemas/portRange'
        - $ref: '#/components/schemas/icmpService'

    icmpService:
      description: Describes an ICMP service type. The protocol property value is always ICMP.
      type: object
      properties:
        protocol:
          $ref: '#/components/schemas/layer4protocol'
        type:
          type: string
          enum:
            - 'icmp-any'
            - 'icmp-echo-reply'
            - 'icmp-destination-unreachable'
            - 'icmp-network-unreachable'
            - 'icmp-host-unreachable'
            - 'icmp-protocol-unreachable'
            - 'icmp-port-unreachable'
            - 'icmp-fragmentation-needed'
            - 'icmp-source-route-failed'
            - 'icmp-network-unknown'
            - 'icmp-host-unknown'
            - 'icmp-network-prohibited'
            - 'icmp-host-prohibited'
            - 'icmp-TOS-network-unreachable'
            - 'icmp-TOS-host-unreachable'
            - 'icmp-communication-prohibited'
            - 'icmp-host-precedence-violation'
            - 'icmp-precedence-cutoff'
            - 'icmp-source-quench'
            - 'icmp-redirect'
            - 'icmp-network-redirect'
            - 'icmp-host-redirect'
            - 'icmp-TOS-network-redirect'
            - 'icmp-TOS-host-redirect'
            - 'icmp-echo-request'
            - 'icmp-router-advertisement'
            - 'icmp-router-solicitation'
            - 'icmp-time-exceeded'
            - 'icmp-ttl-zero-during-transit'
            - 'icmp-ttl-zero-during-reassembly'
            - 'icmp-parameter-problem'
            - 'icmp-ip-header-bad'
            - 'icmp-required-option-missing'
            - 'icmp-timestamp-request'
            - 'icmp-timestamp-reply'
            - 'icmp-address-mask-request'


    portRange:
      description: Describes a layer 4 TCP or UDP port or port-range. The protocol must be either udp or tcp.
      type: object
      required:
       - protocol
       - start_port
      properties:
        protocol:
          $ref: '#/components/schemas/layer4protocol'
        start_port:
          type: integer
          description: The start port of the port range
        end_port:
          type: integer
          description: The end port of the port range.
            If not specified, the range will consist of only one single port (start_port)

    layer4protocol:
      description: Specifies a Layer 4 protocol such as udp or tcp.
      type: string
      enum:
        - tcp
        - udp
        - icmp

    accessRouteListItem:
      description: |
        Format of OpenVPN Access Server's access lists. Each access list entry has
          a class/type that determines how the entry works.

        - The all, all_vpn_clients and all_s2c_subnet types do not require an additional
          property.

        - The user/group require the username/groupname property

        - the nat and route type require the subnet property.

        Note that internally there is also the class subnet and this class can be
        modified with a R/N suffix to be either the route or nat class, so the
        API will represent these with the appropriate class.

        Either username or groupname is set to indicate whether this is a user or
        group assigned access rules.
      type: object
      oneOf:
        - required: [username]
          not:
            required: [groupname]
        - required: [groupname]
          not:
            required: [username]
      properties:
        username:
          $ref: '#/components/schemas/username'
        groupname:
          $ref: '#/components/schemas/groupname'
        access_route:
          oneOf:
            - $ref: '#/components/schemas/accessRoute'
            - type: 'null'
              description: indicator that routes of this type should be deleted

        type:
          type: string
          enum:
            - access_from_ipv6  # not implemented yet
            - access_from_ipv4
            - access_to_ipv4
            - access_to_ipv6  # not implemented yet
          description: the type of access list this item this is in the user/group.
      examples:
        - { 'username': 'johann', access_route: { 'type': 'route', 'accept': 'true', 'subnet': { 'ipv6': true, 'prefix_length': 64, 'netip': '2001:bach:ce1:10::0'}}, 'type': 'access_to_ipv4' }

    accessRoute:
      description: >
        Format of OpenVPN Access Server's access lists. Each access list entry has
        a class/type that determines how the entry works.

        - The all, all_vpn_clients and all_s2c_subnet types do not require an additional
          property.

        - The user/group require the username/groupname property

        - the nat and route type require the subnet property.


        Note that internally there is also the class subnet and this class can be
        modified with a R/N suffix to be either the route or nat class, so the
        API will represent these with the appropriate class.
      type: object
      properties:
        type:
          type: string
          enum:
            - user
            - group
            - route
            - nat
            - all
            - all_vpn_clients
            - all_s2c_subnets
        accept:
          type: boolean
          description: specifies if we accept or deny this particular access

        username:
          $ref: "#/components/schemas/username"
        groupname:
          $ref: '#/components/schemas/groupname'
        subnet:
          $ref: '#/components/schemas/accessRouteSubnet'

    accessRouteSubnet:
      description: |
        The definition of the subnet used by the nat and route accessRoute classes.
        Each one is a subnet with one or more port ranges

        For reference, the internal representation on the Access Server properties looks like this:
        - 192.168.4.0/24
        - 10.10.0.0/24:https,udp/1194,tcp/1194
        - 192.168.99.0/24::R
        - 192.168.99.0/24:https,udp/1194,tcp/1194,udp/2000-2999:R
        - 2001:608:3:814::0/64|https,udp/1194,tcp/1194,udp/2000-2999|R
        - 10.0.0.7/24:icmp-any,rdp,imaps
        - 10.0.0.1/25:icmp-TOS-host-redirect

        Note that the services array is optional. A missing service array indicates
        that the whole subnet is affected regardless of the used layer 4 service
        (icmp, tcp, udp or other IP protocol)
      type: object
      allOf:
        - $ref: '#/components/schemas/IPsubNet'
        - type: object
          properties:
            service:
              type: array
              items:
                $ref: '#/components/schemas/IpService'

    accessControlResponseRuleset:
      description: Represents an access control ruleset.
      type: object
      properties:
        owner:
          type: string
          description: Name of the assignee of this ruleset.
        owner_type:
          type: string
          description: Type of the assignee of this ruleset.
        id:
          type: integer
          description: The ruleset ID.
        name:
          type: string
          description: Name of the ruleset.
        position:
          type: integer
          description: Rulesets are sorted in ascending order by this value.
        comment:
          type: string
          description: Comment for this ruleset.

    newAccessControlRule:
      description: Represents a new access control rule.
      type: object
      properties:
        ruleset_id:
          description: The ID of the ruleset this rule is assigned to.
          type: integer
        type:
          description: The type of the rule.
          $ref: '#/components/schemas/accessControlRuleTypeEnum'
        match_type:
          description: The match type of the rule.
          $ref: '#/components/schemas/accessControlRuleTypeEnum'
        match_data:
          description: The match data.
          type: string
        action:
          description: The action to perform, when this rule matches.
          $ref: '#/components/schemas/accessControlRuleActionEnum'
        position:
          description: The position of this rule within the other rules in the ruleset.
          type: integer
        comment:
          description: Free text comment assigned to this rule.
          type: string
      required: [ruleset_id, type, match_type, match_data, action, position, comment]
      examples:
        - { "ruleset_id": 1, "type": "domain_routing", "match_type": "domain_or_subdomain", "match_data": "doggo.com", "action": "deny", "position": 5000, "comment": "my cat's favorite rule" }

    existingAccessControlRule:
      description: Represents an existing access control rule.
      type: object
      properties:
        id:
          description: The rule ID.
          type: integer
        ruleset_id:
          description: The ID of the ruleset this rule is assigned to.
          type: integer
        type:
          description: The type of the rule.
          $ref: '#/components/schemas/accessControlRuleTypeEnum'
        match_type:
          description: The match type of the rule.
          $ref: '#/components/schemas/accessControlRuleTypeEnum'
        match_data:
          description: The match data.
          type: string
        action:
          description: The action to perform, when this rule matches.
          $ref: '#/components/schemas/accessControlRuleActionEnum'
        position:
          description: The position of this rule within the other rules in the ruleset.
          type: integer
        comment:
          description: Free text comment assigned to this rule.
          type: string
      required: [id, ruleset_id, type, match_type, match_data, action, position, comment]
      examples:
        - { "id": 1, "ruleset_id": 1, "type": "domain_routing", "match_type": "domain_or_subdomain", "match_data": "doggo.com", "action": "deny", "position": 5000, "comment": "my cat's favorite rule" }

    userRulesetsAddMap:
      description: Ruleset mappings for a subject. The subject name is given as the key.
      type: object
      additionalProperties:
        description: List of rulesets to map to the subject
        type: array
        items:
          type: object
          properties:
            ruleset_id:
              description: The ID of the ruleset to associate with the subject.
              type: integer
            position:
              description: Position of the ruleset within all subject's sets. Sorted ascending.
              type: integer
          required: [ruleset_id, position]
        minItems: 1

    userRulesetsDeleteMap:
      description: Ruleset mappings to delete for a subject. The subject name is given as the key.
      type: object
      additionalProperties:
        type: object
        properties:
          ruleset_ids:
            description: A list of ruleset IDs to delete for the subject..
            type: array
            items:
              type: integer
            minItems: 1

    IPsubNet:
      description: Describes an IP subnet.
      properties:
        ipv6:
          type: boolean
          description: whether this describes an IPv4 or an IPv6 subnet
        netip:
          type: string
          description: the network IP address.
          examples:
            -  fd00::18cc:1b01:a772:50e1
        prefix_length:
          type: integer
          description: length of the prefix in CIDR notation
          examples:
            -  56
      examples:
        - { 'prefix_length': 21, 'netip': '131.234.72.0', 'ipv6': false}
        - { 'prefix_length': 128, 'netip': '2001:638:502:c000:b::9', 'ipv6': true }


    groupIpRange:
      description: |
        An IP range that defines the allowed IP addresses for a group. Represented on the backend as one of the following formats:

          - "first_ip-last_ip"
          - "first_ip~numberOfIps"
          - "first_ip:last_ip" (IPv4 only, deprecated)

      type: object
      properties:
        ipv6:
          type: boolean
          description: whether this describes an IPv4 or an IPv6 range
        first_ip:
          type: string
          description: the start address of the IP range.
          examples:
            -  fd00::18cc:1b01:a772:50e1
        last_ip:
          type: string
          description: the end address of the IP range.
          examples:
            -  fd00::18cc:1b01:a772:80e1

    failOverTestResult:
      description: The result of a single failover test.
      type: object
      required:
        - status
        - message
      properties:
        friendly:
          type: string
          description: Human readable interpretation of the test
        status:
          type: boolean
          description: Whether this test succeeded or not
        message:
          type: string
          description: detailed string of the test result


    failOverTestStatus:
      description: The result of running the failover tests. The failover test runs a number of subtests. Note that if
        the connectivity test fails, often the other tests will fail as well.
      type: object
      properties:
        ucarp:
          $ref: "#/components/schemas/failOverTestResult"
        license_primary:
          $ref: "#/components/schemas/failOverTestResult"
        license_secondary:
          $ref: "#/components/schemas/failOverTestResult"
        connectivity:
          $ref: "#/components/schemas/failOverTestResult"

    AcmeTLSAlpnChallenge:
      type: object
      required:
        - servername
        - certificate
        - private_key
      properties:
        servername:
          type: string
          description: the servername (used in SNI) that this certificate should be presented for
        certificate:
          $ref: '#/components/schemas/pemEncodedCertificate'
        private_key:
          $ref: '#/components/schemas/pemEncodedPrivateKey'

    AcmeChallenge:
      description: Provides a list of X509 certificates and server names that the webserver should use to answer
        ACME tls-alpn-01 challenges
      type: object
      required:
        - tls_alpn_challenges
      properties:
        expiry:
          description: A timeout in seconds after which the web server should no longer serve the challenge certificates
          type: integer
        tls_alpn_challenges:
          description: A list of tls-alpn-01 challenge certificates
          type: array
          items:
            $ref: '#/components/schemas/AcmeTLSAlpnChallenge'


  parameters:
    backendSelection:
      in: header
      name: X-OpenVPN-AS-Node
      schema:
        type: string
      description: >
        Optional header used to determine which backend node
        the request should be forwarded to.

        The value must match the node name, not the node `api_endpoint`.
        See the /proxy pseudo-endpoint for a description of the proxying mechanism.
    downloadTokenParameter:
      name: token
      in: query
      description: One-time profile download token
      schema:
        type: string
    tlsCryptV2CapabilityParameter:
      name: tls-cryptv2
      in: query
      required: false
      description: Set to true if the client supports TLS-Crypt v2. This setting is only indicates
        the capbility of the client. It can be ignored if the server sides enforce always
        TLS-Crypt v2 or the server configuration does not support TLS-Crypt V2.
      schema:
        type: boolean

  responses:
    adminOnly:
      description: Only admin users are allowed to use this API endpoint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorReason'
          examples:
            norights:
              value: { "message": "Insufficient privileges to use this API" }
              description: standard response when there insufficient rights to use an API.


    deleteResponse:
      description: Profiles were successfully deleted.
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                description: describes status of deletion
                type: string

    xmlerrorresponse:
      description: An XMLRPC-style error response for compatibility with older /rest APIs.
        For compatibility reasons this way of reporting errors is used.
      content:
        text/xml:
          schema:
            error:
              type: object
            properties:
              Type:
                type: string
                examples:
                  - Invalid Request
              Synopsis:
                type: string
                examples:
                  - REST method failed
              Message:
                type: string
                examples: ['No permission to generate profile (9422)']
            xml:
              name: "Error"



  headers:
    VPN-Session-Token:
      schema:
        type: string
        description: "Optional header. Indicates a token used as a password to directly connect to the VPN. See spec linked in VPN-Session-User header"

    VPN-Session-User:
      schema:
        type: string
        description: Optional header. Indicates a username that can be used to directly connect to the VPN as authenticated user.
          For full details see of the specification see https://github.com/OpenVPN/openvpn3/blob/master/doc/webauth.md#openvpnimport-profile-url

security:
  - AuthToken: [ ]
